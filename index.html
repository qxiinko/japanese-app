<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3f5e8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Японский: путь к аниме</title>
<style>
/* Японский: путь к аниме — стили. Палитра: тёплая бумага + индиго (藍) + киноварь (朱) в качестве акцента-печати. */
:root{
  --bg:#f7f3ea; --bg2:#efe9db; --card:#fffdf8; --ink:#2b3440; --ink2:#5c6773;
  --line:#e0d8c8; --accent:#3f5e8c; --accent-ink:#fff; --seal:#c94f39;
  --ok:#3a8f5f; --bad:#b6402f; --warn:#a4731d; --chip:#eef1f6;
  --font-ui:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-jp:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP","Meiryo",sans-serif;
  --radius:14px; --shadow:0 2px 10px rgba(60,50,30,.08);
}
html[data-theme="dark"]{
  --bg:#12161d; --bg2:#0d1016; --card:#1b212b; --ink:#e8e4da; --ink2:#9aa4b0;
  --line:#2b333f; --accent:#7fa3d4; --accent-ink:#10161f; --seal:#d96a52;
  --ok:#5cb98a; --bad:#e07863; --warn:#d3a049; --chip:#232c38;
  --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%}
#app{max-width:860px;margin:0 auto;padding:0 16px 90px;min-height:100vh}
.jp,.q-jp,rt{font-family:var(--font-jp)}
h1,h2,h3{line-height:1.25}
a{color:var(--accent)}
button{font-family:inherit;font-size:1rem;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* ---------- Шапка и навигация ---------- */
.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.top .hanko{width:44px;height:44px;flex:0 0 44px;background:var(--seal);color:#fff;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-jp);font-size:19px;font-weight:700;line-height:1.05;text-align:center}
.top .title{font-weight:700;font-size:1.05rem}
.top .sub{color:var(--ink2);font-size:.82rem}
nav.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
nav.tabs button{background:none;border:none;padding:10px 12px;color:var(--ink2);border-bottom:3px solid transparent;
  margin-bottom:-2px;white-space:nowrap;font-weight:600}
nav.tabs button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
@media(max-width:640px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--card);border-top:2px solid var(--line);
    border-bottom:none;z-index:50;padding:4px 8px calc(4px + env(safe-area-inset-bottom));justify-content:space-around}
  nav.tabs button{margin-bottom:0;border-bottom:none;border-top:3px solid transparent;padding:8px 6px;font-size:.85rem}
  nav.tabs button[aria-current="page"]{border-top-color:var(--accent);border-bottom:none}
  #app{padding-bottom:110px}
}
/* ---------- Карточки, кнопки ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.card h2,.card h3{margin-top:0}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:12px 20px;font-weight:700}
.btn.big{width:100%;font-size:1.1rem;padding:15px}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.small{padding:7px 12px;font-size:.9rem}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--ink2);font-size:.92rem}
.badge{display:inline-block;background:var(--chip);border-radius:99px;padding:2px 10px;font-size:.8rem;color:var(--ink2)}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
/* ---------- Экран «Сегодня» ---------- */
.hero{display:flex;gap:16px;align-items:flex-start;margin:10px 0 4px}
.hero .big-day{font-family:var(--font-jp);font-size:2rem;font-weight:800;color:var(--accent);line-height:1.1}
.hero h1{margin:0;font-size:1.45rem}
.plan-list{margin:8px 0;padding-left:0;list-style:none}
.plan-list li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.plan-list li:last-child{border-bottom:none}
.plan-list .min{flex:0 0 58px;color:var(--ink2);font-size:.85rem}
.stat-chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stat-chips .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center;flex:1;min-width:80px}
.stat b{display:block;font-size:1.15rem}
.stat span{font-size:.75rem;color:var(--ink2)}
/* ---------- Урок: контент ---------- */
.lesson-step{max-width:680px;margin:0 auto}
.ex-plain{border-left:4px solid var(--accent);padding-left:14px;margin:12px 0}
.ex-plain p{margin:8px 0}
table.examples{width:100%;border-collapse:collapse;margin:10px 0}
table.examples td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.examples td.jp-cell{font-family:var(--font-jp);font-size:1.08rem;white-space:nowrap}
.mistake{background:color-mix(in srgb,var(--bad) 8%,transparent);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);
  border-radius:10px;padding:10px 14px;margin:10px 0}
.mistake .bad-ans{color:var(--bad);font-weight:600}
.mistake .good-ans{color:var(--ok);font-weight:600}
ruby{ruby-align:center}
ruby rt{font-size:.72em;color:var(--ink2)}
html[data-furigana="hidden"] rt{display:none}
html[data-furigana="tap"] ruby{cursor:pointer}
html[data-furigana="tap"] rt{display:none}
html[data-furigana="tap"] ruby.revealed rt{display:block}
/* ---------- Упражнения ---------- */
.q-prompt{font-size:1.05rem;margin:6px 0 14px}
.q-jp{font-family:var(--font-jp);font-size:1.5rem;margin:8px 0;display:block}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;font-size:1rem;color:var(--ink)}
.opt.jp-opt{font-family:var(--font-jp);font-size:1.2rem}
.opt.selected{border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.assemble-line{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;background:var(--bg2)}
.token{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 14px;font-family:var(--font-jp);font-size:1.15rem}
.token.in-answer{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
input.type-in{width:100%;font-size:1.2rem;padding:12px 14px;border:2px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);font-family:var(--font-jp)}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match-grid .opt[disabled]{cursor:default;opacity:.85}
.feedback{border-radius:12px;padding:12px 14px;margin:12px 0;border:2px solid}
.feedback.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.feedback.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.feedback .why{margin:6px 0 0;color:var(--ink)}
.progress-bar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:8px 0 16px}
.progress-bar>div{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.play-btn{width:56px;height:56px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);font-size:1.5rem}
.audio-note{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);
  border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.92rem}
/* ---------- SRS ---------- */
.srs-card{text-align:center;padding:28px 18px}
.srs-card .q-jp{font-size:2.2rem}
.grade-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grade-row button{border-radius:10px;border:2px solid var(--line);background:var(--card);padding:10px 4px;font-weight:600;color:var(--ink)}
.grade-row .g0{border-color:var(--bad);color:var(--bad)}
.grade-row .g1{border-color:var(--warn);color:var(--warn)}
.grade-row .g2{border-color:var(--ok);color:var(--ok)}
.grade-row .g3{border-color:var(--accent);color:var(--accent)}
/* ---------- Статистика ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:340px}
.cal .day{aspect-ratio:1;border-radius:4px;background:var(--bg2);border:1px solid var(--line);position:relative}
.cal .day.l1{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.cal .day.l2{background:color-mix(in srgb,var(--accent) 60%,transparent)}
.cal .day.l3{background:var(--accent)}
.cal .day.today{outline:2px solid var(--seal)}
/* ---------- Настройки / прочее ---------- */
.field{margin:14px 0}
.field label{display:block;font-weight:600;margin-bottom:6px}
.field select,.field input[type=range]{width:100%;max-width:340px}
.switch{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.kanban{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.course-item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.course-item .num{width:40px;height:40px;flex:0 0 40px;border-radius:10px;background:var(--chip);display:flex;
  align-items:center;justify-content:center;font-weight:800;color:var(--ink2)}
.course-item.done .num{background:var(--ok);color:#fff}
.course-item.active .num{background:var(--accent);color:var(--accent-ink)}
.course-item.locked{opacity:.55}
.course-item .meta{flex:1}
.course-item .meta b{display:block}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:100;max-width:90vw}
#toast.show{opacity:1}
.locked-note{font-size:.85rem;color:var(--ink2)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* Лаборатория */
.sub-hidden{filter:blur(7px);transition:filter .2s}
.sub-hidden:hover{filter:blur(4px)}
#cue-list .course-item{align-items:flex-start}
.token-miss{opacity:.55;border-style:dashed;cursor:pointer}
#anki-preview select{max-width:340px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:8px}

/* ---------- Палитры акцента (Настройки → Акцент) ---------- */
html[data-accent="sakura"]{--accent:#c2527d;--accent-ink:#fff;--seal:#8f5fa8;--chip:#f7ecf2}
html[data-accent="matcha"]{--accent:#4e7d4e;--accent-ink:#fff;--seal:#b2593a;--chip:#edf3ec}
html[data-accent="sumi"]{--accent:#4a4a55;--accent-ink:#fff;--seal:#c94f39;--chip:#ece9e4}
html[data-accent="ai"]{--accent:#7d5fc2;--accent-ink:#fff;--seal:#d96a52;--chip:#f0ecf7}
html[data-theme="dark"][data-accent="sakura"]{--accent:#e08cb0;--accent-ink:#241018;--chip:#2c2229}
html[data-theme="dark"][data-accent="matcha"]{--accent:#8fbf8f;--accent-ink:#12200f;--chip:#222b22}
html[data-theme="dark"][data-accent="sumi"]{--accent:#b8b8c4;--accent-ink:#17171d;--chip:#26262e}
html[data-theme="dark"][data-accent="ai"]{--accent:#b39ddb;--accent-ink:#1d1430;--chip:#272235}

/* ---------- Разная вёрстка: ПК (≥1024px) ---------- */
@media (min-width:900px){
  #app{max-width:1080px;padding:76px 32px 60px 210px;position:relative}
  html{scroll-padding-top:80px}
  nav.tabs{position:fixed;left:0;top:0;bottom:0;width:178px;flex-direction:column;justify-content:flex-start;
    gap:2px;background:var(--card);border-right:2px solid var(--line);border-bottom:none;
    margin:0;padding:76px 10px 20px;z-index:40;overflow:visible}
  nav.tabs button{text-align:left;border-bottom:none;border-left:3px solid transparent;border-radius:0 8px 8px 0;margin:0;padding:12px 14px}
  nav.tabs button[aria-current="page"]{border-left-color:var(--accent);border-bottom-color:transparent;background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .top{position:fixed;left:0;right:0;top:0;z-index:45;background:var(--bg);margin:0;
    padding:12px 32px 12px 210px;border-bottom:1px solid var(--line)}
  .stat-chips{display:grid;grid-template-columns:repeat(4,1fr)}
  .course-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .course-item{margin:0}
  .lesson-step{max-width:none}
  table.examples td.jp-cell{white-space:normal;min-width:220px}
  .srs-card .q-jp{font-size:2.8rem}
  .hero{align-items:center}
  .hero .big-day{font-size:2.6rem}
  #toast{bottom:32px}
}
@media (max-width:1023px){
  .course-list{display:block}
}

</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ============================================================
   Ядро (чистые функции, без DOM). Версии:
   - схема состояния: STATE_VERSION = 1
   - планировщик:     SCHED_VERSION = 'sm2-adapted-v1'
   Планировщик — адаптированный SM-2 (SuperMemo-2): 4 оценки,
   лёгкость EF, интервалы в днях; «не помню» сбрасывает серию
   и возвращает карточку в тот же сеанс. Никаких случайностей.
   ============================================================ */
const STATE_VERSION = 1;
const SCHED_VERSION = 'sm2-adapted-v1';

/* ---------- Фуригана: запись вида 漢字[かんじ] → <ruby> ---------- */
function renderFuri(text){
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/([一-龯々〆ヶ]+)\[([ぁ-んー・]+)\]/g, '<ruby>$1<rt>$2</rt></ruby>');
}
function stripFuri(text){ return text.replace(/\[[^\]]*\]/g,''); }

/* ---------- Нормализация ответов ---------- */
function kataToHira(s){
  let out='';
  for(const ch of s){
    const c=ch.codePointAt(0);
    if(c>=0x30A1&&c<=0x30F6) out+=String.fromCodePoint(c-0x60);
    else if(ch==='ヴ') out+='ぶ';
    else out+=ch;
  }
  return out;
}
function normalizeAnswer(s){
  return kataToHira(String(s||'').trim().toLowerCase())
    .replace(/[\s\u3000、。．，！？!?「」『』（）()・\-—ー_,.:;'""]/g,'')
    .replace(/／/g,'/');
}

/* ---------- Проверка ввода: массив допустимых вариантов ---------- */
function checkInput(user, accept){
  const u=normalizeAnswer(user);
  if(!u) return false;
  return accept.some(a=>normalizeAnswer(a)===u);
}

/* ---------- Планировщик SM-2 (адаптированный) ----------
   Оценки: 0 «не помню», 1 «трудно», 2 «помню», 3 «легко».
   Карточка: {id, ef, ivl (дни), due (ms), n (серия), lapses, updatedAt} */
const DAY=86400000, MIN=60000;
function newCard(id){
  return {id, ef:2.5, ivl:0, due:Date.now(), n:0, lapses:0, seen:0, correct:0, sched:SCHED_VERSION};
}
function schedule(card, grade, now){
  now=now||Date.now();
  const c=Object.assign({},card);
  c.ef=Math.min(3.2,Math.max(1.3,c.ef||2.5));
  c.seen=(c.seen||0)+1;
  if(grade===0){
    c.n=0; c.lapses=(c.lapses||0)+1; c.ivl=0; c.due=now+10*MIN; c.ef=Math.max(1.3,c.ef-0.2);
  }else{
    if(grade===1){ c.ivl=Math.max(1,(c.ivl||0)*1.2); c.ef=Math.max(1.3,c.ef-0.15); }
    else if(grade===2){ c.ivl=c.n===0?2:Math.max(2,(c.ivl||0)*c.ef); }
    else { c.ivl=c.n===0?4:Math.max(3,(c.ivl||0)*c.ef*1.3); c.ef=Math.min(3.2,c.ef+0.15); }
    c.n=(c.n||0)+1;
    c.due=now+Math.round(c.ivl*DAY);
  }
  c.updatedAt=now;
  return c;
}

/* ---------- Объединение состояний при импорте ----------
   Правило: не удалять историю молча. Для карточек берётся запись
   с более поздним updatedAt; по урокам — статус «пройден» не
   снимается, счёт берётся максимальный; журнал активности суммируется. */
function mergeState(base, imp){
  const out=Object.assign({},base);
  out.cards=Object.assign({},base.cards);
  const impCards=(imp&&imp.cards)||{};
  for(const k of Object.keys(impCards)){
    const a=out.cards[k], b=impCards[k];
    if(!a || ((b.updatedAt||0)>(a.updatedAt||0))) out.cards[k]=b;
  }
  out.lessons=Object.assign({},base.lessons);
  const impLessons=(imp&&imp.lessons)||{};
  for(const k of Object.keys(impLessons)){
    const a=out.lessons[k], b=impLessons[k];
    if(!a) out.lessons[k]=b;
    else out.lessons[k]={status:(a.status==='done'||b.status==='done')?'done':(a.status||b.status),
      score:Math.max(a.score||0,b.score||0), at:Math.max(a.at||0,b.at||0)};
  }
  out.log=Object.assign({},base.log);
  const impLog=(imp&&imp.log)||{};
  for(const d of Object.keys(impLog)){
    const a=out.log[d]||{}, b=impLog[d]||{};
    out.log[d]={answers:(a.answers||0)+(b.answers||0), correct:(a.correct||0)+(b.correct||0),
      reviews:(a.reviews||0)+(b.reviews||0), minutes:Math.max(a.minutes||0,b.minutes||0)+(b.minutes&&a.minutes?0:0)};
    out.log[d].minutes=Math.max(a.minutes||0,b.minutes||0);
  }
  out.xp=Math.max(base.xp||0, (imp&&imp.xp)||0);
  out.reports=[].concat(base.reports||[],(imp&&imp.reports)||[]);
  out.mistakes=[].concat(base.mistakes||[],(imp&&imp.mistakes)||[]).slice(-500);
  out.meta=Object.assign({},base.meta,{updatedAt:Date.now()});
  return out;
}

/* ---------- Диагностика → маршрут ---------- */
function makeRoute(diag){
  const notes=[];
  if(!diag.done) return {hira:'unknown', kata:'weak', notes:['Пройдите диагностику каны.']};
  if(diag.hira>=0.85) notes.push('Хирагана в порядке — обязательный блок не назначен, слабые знаки уйдут в повторения.');
  else notes.push('Хирагана: закрепление через ежедневные повторения (слабые знаки добавлены в колоду).');
  if(diag.kata>=0.85) notes.push('Катакана в порядке.');
  else notes.push('Катакана: слабые знаки добавлены в колоду повторений.');
  return {hira:diag.hira>=0.85?'ok':'weak', kata:diag.kata>=0.85?'ok':'weak', notes};
}

/* ---------- Дата в формате YYYY-MM-DD (локальная) ---------- */
function dayKey(ts){ const d=new Date(ts||Date.now());
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function streakDays(log){
  let s=0, d=new Date(); 
  for(let i=0;i<400;i++){
    const k=dayKey(d.getTime()-i*DAY), e=log[k];
    if(e&&((e.answers||0)+(e.reviews||0))>0) s++;
    else if(i>0) break;
  }
  return s;
}

/* ---------- Токенизация для «собери предложение» ---------- */
function shuffle(arr, rnd){ const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor((rnd?rnd():Math.random())*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a; }



/* ============================================================
   ЭТАП 3: разбор субтитров SRT/VTT (чистые функции).
   Честное ограничение: сопоставление русских субтитров делается
   по номеру реплики и может не совпасть по разбиению. ============================================================ */
function parseTimecode(s){
  const m=String(s).trim().match(/^(?:(\d+):)?(\d{1,2}):(\d{1,2})[,.](\d{1,3})$/);
  if(!m)return null;
  const h=+(m[1]||0),min=+m[2],sec=+m[3],ms=+((m[4]||'0').padEnd(3,'0').slice(0,3));
  return h*3600+min*60+sec+ms/1000;
}
function formatTimecode(t,comma){
  const ms=Math.round((t-Math.floor(t))*1000);
  const tot=Math.floor(t);
  const h=Math.floor(tot/3600),min=Math.floor((tot%3600)/60),sec=tot%60;
  const p=n=>String(n).padStart(2,'0');
  return p(h)+':'+p(min)+':'+p(sec)+(comma?',':'.')+String(Math.min(ms,999)).padStart(3,'0');
}
function cleanSubText(s){
  return String(s).replace(/<[^>]+>/g,'').replace(/\{[^}]*\}/g,'').replace(/^[\u200b]+/,'').trim();
}
function parseSubtitles(raw){
  const text=String(raw||'').replace(/^\uFEFF/,'').replace(/\r/g,'');
  if(/WEBVTT/.test(text.split('\n')[0]||''))return parseCueBlocks(text.replace(/^WEBVTT[^\n]*\n/,''));
  return parseCueBlocks(text);
}
function parseCueBlocks(text){
  const cues=[];
  for(const b of text.split(/\n\n+/)){
    const lines=b.split('\n').filter(l=>l.trim()!=='');
    if(!lines.length)continue;
    const ti=lines.findIndex(l=>l.includes('-->'));
    if(ti<0)continue;
    const parts=lines[ti].split('-->');
    const start=parseTimecode(parts[0]);
    const endRaw=parts[1].trim().split(/\s+/)[0];
    const end=parseTimecode(endRaw);
    const body=lines.slice(ti+1).join('\n');
    if(start===null||end===null||!body||end<=start)continue;
    cues.push({start,end,text:cleanSubText(body)});
  }
  return cues.sort((a,b)=>a.start-b.start);
}
function shiftCues(cues,delta){
  return cues.map(c=>({start:Math.max(0,c.start+delta),end:Math.max(0.1,c.end+delta),text:c.text}));
}
function hashText(s){
  let h=0;const str=String(s);
  for(let i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))|0;}
  return 'lab_'+(h>>>0).toString(36);
}

/* ============================================================
   ЭТАП 3: словарный разбор реплик лаборатории.
   ЧЕСТНОЕ ОГРАНИЧЕНИЕ: это поиск совпадений с встроенным
   словарём (словарные формы), а НЕ грамматический разбор:
   формы глаголов (飲みます, 食べた, 起きて) распознаются только
   если совпадают с формой из словаря. ============================================================ */
function buildLabIndex(wordsDict,userDict){
  const idx=[];
  for(const id of Object.keys(wordsDict)){
    const w=wordsDict[id];
    for(let form of [w.jp,w.kana]){
      form=String(form).trim();
      if(!form)continue;
      idx.push({form,ru:w.ru,pos:w.pos,src:'dict'});
      if(/さん$/.test(form))idx.push({form:form.slice(0,-2),ru:w.ru,pos:w.pos,src:'dict'});
      const h=kataToHira(form);
      if(h!==form)idx.push({form:h,ru:w.ru,pos:w.pos,src:'dict'});
    }
  }
  for(const form of Object.keys(userDict||{})){
    idx.push({form,ru:(userDict[form]||{}).ru||'',pos:'добавлено вами',src:'user'});
  }
  idx.sort((a,b)=>b.form.length-a.form.length);
  return idx;
}
function tokenizeLabText(text,idx){
  const tokens=[];
  let buf='',i=0;
  const flush=()=>{if(buf){tokens.push({t:buf,hit:null});buf='';}};
  while(i<text.length){
    let matched=false;
    for(const entry of idx){
      if(entry.form&&text.startsWith(entry.form,i)){
        flush();
        tokens.push({t:entry.form,hit:entry});
        i+=entry.form.length;
        matched=true;
        break;
      }
    }
    if(!matched){buf+=text[i];i++;}
  }
  flush();
  return tokens;
}

/* ============================================================
   ЭТАП 3: импорт текстового экспорта Anki.
   Поддерживается текстовый экспорт (Файл → Экспорт → «Простой
   текст, поля через таб/точку с запятой»). .apkg НЕ поддерживается.
   Порядок полей Anki «Японский Corey»: японское, чтение,
   значение — но пользователь сопоставляет колонки сам. ============================================================ */
function detectAnkiDelimiter(line){
  const tabs=(String(line).match(/\t/g)||[]).length;
  const semis=(String(line).match(/;/g)||[]).length;
  if(tabs>0&&tabs>=semis)return '\t';
  if(semis>0)return ';';
  return '\t';
}
function parseAnkiLine(line,delim){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(q){
      if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=ch;
    }else{
      if(ch==='"')q=true;
      else if(ch===delim){out.push(cur);cur='';}
      else cur+=ch;
    }
  }
  out.push(cur);
  return out.map(s=>s.replace(/\\n/g,'\n').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').trim());
}
function parseAnkiExport(raw){
  const text=String(raw||'').replace(/^\uFEFF/,'').replace(/\r/g,'');
  const lines=text.split('\n').filter(l=>l.trim()!=='');
  if(!lines.length)return {rows:[],delimiter:'\t',headerSkipped:false};
  const delim=detectAnkiDelimiter(lines[0]);
  let headerSkipped=false;
  while(lines.length&&/#separator|#html|#notetype|#deck|#columns/i.test(lines[0])){lines.shift();headerSkipped=true;}
  const rows=lines.map(l=>parseAnkiLine(l,delim)).filter(r=>r.some(f=>f!==''));
  return {rows,delimiter:delim,headerSkipped};
}
function findDuplicates(rows,mapping,existingCards,wordsDict){
  const dup=[];
  rows.forEach((r,i)=>{
    const jp=(r[mapping.jp]||'').replace(/\[[^\]]*\]/g,'').trim();
    if(!jp)return;
    let reason=null;
    if(existingCards[idForLab(jp)])reason='уже есть карточка из этой строки';
    else if(existingCards['w_'+jp]||Object.keys(wordsDict).some(id=>wordsDict[id].jp===jp))reason='слово уже есть во встроенном словаре';
    if(reason)dup.push({row:i,jp,reason});
  });
  return dup;
}
function idForLab(jp){return hashText('anki:'+jp);}

/* ============================================================
   ЭТАП 3: отдельная колода кандзи.
   Знаки извлекаются из слов встроенного словаря: карточка кандзи
   содержит знак, слова с ним и чтение В ЭТИХ словах (не список
   «всех чтений»). Мнемоник в данных нет — не выдумываем. ============================================================ */
function extractKanji(s){return (String(s).match(/[一-龯々]/g)||[]);}
function buildKanjiDeck(wordsDict,existingCards){
  const map={};
  for(const id of Object.keys(wordsDict)){
    const w=wordsDict[id];
    for(const k of extractKanji(w.jp)){
      if(!map[k])map[k]={kanji:k,words:[],ids:[]};
      if(map[k].ids.length<4){
        map[k].ids.push(id);
        map[k].words.push({jp:w.jp,kana:w.kana,ru:w.ru});
      }
    }
  }
  const deck={};
  for(const k of Object.keys(map).sort()){
    const id='kz_'+k;
    deck[id]={id,kanji:k,words:map[k].words,count:0};
    for(const id2 of Object.keys(wordsDict)){
      if(extractKanji(wordsDict[id2].jp).includes(k))deck[id].count++;
    }
  }
  return deck;
}

/* ============================================================
   ЭТАП 3: направления навыков слова (ТЗ §7).
   Успех в одном навыке не засчитывается за остальные:
   - rec  : узнавание (японское → значение)
   - read : чтение (значение/японское → кана)
   - listen: на слух (аудио → значение; только если есть голос)
   Каждое направление — отдельная SM-2-карта с суффиксом направления.
   Старые карты (без направления) остаются и работают как rec. ============================================================ */
const SKILL_DIRS=['rec','read','listen'];
function dirCardId(wordId,dir){return wordId+'@'+dir;}
function baseIdFromDir(id){const p=String(id).split('@');return p[0];}
function dirFromId(id){const p=String(id).split('@');return p[1]||'rec';}
/* какой базовый контент есть у слова (не у каны/кандзи) */
function wordEntryFor(wordsDict,id){
  const base=baseIdFromDir(id);
  return wordsDict[base]||null;
}

   ЭТАП 3: приостановка карточек и экспорт слов (ТЗ §7). ============================================================ */
function isSuspended(state,id){const c=state.cards[id];return !!(c&&c.suspended);}
function exportWordsCSV(state,wordsDict){
  const rows=[['id','японское','чтение','значение','интервал(дн.)','приостановлена']];
  for(const id of Object.keys(state.cards)){
    if(id.startsWith('k_')||id.startsWith('kz_')||id.includes('@')||id.startsWith('lab_'))continue;
    const c=state.cards[id],w=wordsDict[id];
    rows.push([id,w?w.jp:(c.jp||''),w?w.kana:(c.kana||''),w?w.ru:(c.ru||''),c.ivl||0,c.suspended?'да':'нет']);
  }
  return rows.map(r=>r.map(f=>{const v=String(f==null?'':f);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\n');
}

/* ============================================================
   ЭТАП 3: разбивка прогресса по этапам SM-2 и направлениям.
   Этапы: new (новая) / learn (1–6 дн.) / young (7–20 дн.) /
   mature (закреплено, ≥21 дн.). Приостановленные считаются отдельно. ============================================================ */
function srsStageOf(c){
  if(!c||!(c.n>0))return 'new';
  if(c.ivl>=21)return 'mature';
  if(c.ivl>=7)return 'young';
  return 'learn';
}
function srsBreakdown(state){
  const empty=()=>({new:0,learn:0,young:0,mature:0,susp:0});
  const res={rec:empty(),read:empty(),listen:empty(),kanji:empty()};
  for(const id of Object.keys(state.cards||{})){
    const c=state.cards[id];
    const d=id.includes('@')?dirFromId(id):'rec';
    if(!res[d])continue;
    res[d][srsStageOf(c)]++;
    if(c.suspended)res[d].susp++;
  }
  for(const id of Object.keys(state.kanjiCards||{})){
    const c=state.kanjiCards[id];
    res.kanji[srsStageOf(c)]++;
    if(c.suspended)res.kanji.susp++;
  }
  return res;
}

'use strict';
/* ============================================================
   Хранилище: IndexedDB (основное) с fallback на localStorage.
   Всё состояние — один ключ 'state' версии STATE_VERSION.
   ============================================================ */
const DB_NAME='jp_path_db', DB_STORE='kv';
let _idb=null;
function idb(){
  if(_idb) return _idb;
  _idb=new Promise((res,rej)=>{
    try{
      const req=indexedDB.open(DB_NAME,1);
      req.onupgradeneeded=()=>{ if(!req.result.objectStoreNames.contains(DB_STORE)) req.result.createObjectStore(DB_STORE); };
      req.onsuccess=()=>res(req.result);
      req.onerror=()=>rej(req.error);
    }catch(e){ rej(e); }
  });
  return _idb;
}
async function idbGet(key){
  const db=await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).get(key);
    tx.onsuccess=()=>res(tx.result); tx.onerror=()=>rej(tx.error);
  });
}
async function idbSet(key,val){
  const db=await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction(DB_STORE,'readwrite').objectStore(DB_STORE).put(val,key);
    tx.onsuccess=()=>res(); tx.onerror=()=>rej(tx.error);
  });
}
function lsGet(key){ try{ return JSON.parse(localStorage.getItem(key)); }catch(e){ return undefined; } }
function lsSet(key,val){ try{ localStorage.setItem(key,JSON.stringify(val)); }catch(e){} }

function defaultState(){
  return {
    v:STATE_VERSION,
    settings:{theme:'light',furigana:'always',newLimit:7,voiceURI:'',rate:0.9,romaji:false,accent:'indigo'},
    diag:{done:false,hira:0,kata:0,weak:[]},
    lessons:{},          // id -> {status:'done'|'started', score, at}
    exams:{},            // id -> {status:'done'|'attempted', score, at, attempts}
    kanjiCards:{},       // kz_* -> карточка SM-2 кандзи
    cards:{},            // id -> карточка SM-2
    log:{},              // 'YYYY-MM-DD' -> {answers,correct,reviews,minutes}
    mistakes:[],         // [{exId, at}]
    reports:[],          // [{exId, at, text}]
    xp:0,
    meta:{createdAt:Date.now(),updatedAt:Date.now()}
  };
}

let STATE=defaultState();
let _saveTimer=null;
function queueSave(){
  STATE.meta.updatedAt=Date.now();
  if(_saveTimer) return;
  _saveTimer=setTimeout(()=>{ _saveTimer=null; persistState(); },400);
}
async function persistState(){
  try{ await idbSet('state',STATE); }catch(e){ lsSet('jp_path_state',STATE); }
}
function withTimeout(p,ms,fallback){
  return Promise.race([p,new Promise(res=>setTimeout(()=>res(fallback),ms))]);
}
async function loadState(){
  let loaded;
  try{ loaded=await withTimeout(idbGet('state'),2000,undefined); }
  catch(e){ loaded=undefined; }
  if(loaded===undefined) loaded=lsGet('jp_path_state');
  if(loaded&&loaded.v===STATE_VERSION) STATE=loaded;
  else if(loaded&&loaded.v!==STATE_VERSION){
    // Будущие миграции добавлять здесь, не сбрасывая данные.
    STATE=Object.assign(defaultState(),loaded,{v:STATE_VERSION});
    if(!STATE.exams)STATE.exams={};
    if(!STATE.kanjiCards)STATE.kanjiCards={};
    if(!STATE.settings.accent)STATE.settings.accent='indigo';
  }
  return STATE;
}
function logEvent(field,n){ // field: 'answers'|'correct'|'reviews'
  const k=dayKey();
  const e=STATE.log[k]||(STATE.log[k]={answers:0,correct:0,reviews:0,minutes:0});
  e[field]=(e[field]||0)+(n||1);
  queueSave();
}

  {t:'explain',h:'Две формы глагола и частица を',html:`<p>У глагола две базовые «ипостаси»: <b>словарная форма</b> (так глаголы записаны в словарях: <span class="jp">飲[の]む</span>) и <b>вежливая форма на ます</b> (так говорят в диалоге: <span class="jp">飲みます</span>). Пока мы учим ます-форму, а словарную запоминаем как вид глагола.</p>
   <p>Прямое дополнение (что? кого?) помечается частицей <span class="jp">を</span> (читается «о»):</p>
   <table class="examples">
    <tr><td class="jp-cell">水[みず]を飲みます。</td><td>Пью воду.</td></tr>
    <tr><td class="jp-cell">日本語[にほんご]を話[はな]します。</td><td>Говорю по-японски.</td></tr>
    <tr><td class="jp-cell">アニメを見[み]ます。</td><td>Смотрю аниме.</td></tr>
   </table>
   <p>Направление движения («куда?») — частица <span class="jp">に</span> (реже へ, читается «э»): <span class="jp">学校[がっこう]に行[い]きます。</span> «Иду в школу».</p>`},
  {t:'explain',h:'Отрицание и прошедшее время',html:`<p>Формы меняются у самой ます-частицы, глагольная основа не трогается:</p>

    <tr><td class="jp-cell">読[よ]み<b>ます</b></td><td>читаю (наст./будущ.)</td></tr>
    <tr><td class="jp-cell">読み<b>ません</b></td><td>не читаю</td></tr>
    <tr><td class="jp-cell">読み<b>ました</b></td><td>прочитал / читал</td></tr>
    <tr><td class="jp-cell">読み<b>ませんでした</b></td><td>не читал</td></tr>
   </table>
   <p>Настоящее и будущее в японском — одна форма: <span class="jp">毎日[まいにち]、水を飲みます。</span> «Каждый день пью воду», <span class="jp">明日[あした]、行きます。</span> «Завтра пойду».</p>
   <p>И снова про опущение: если ясно, что это я, «私は» можно не говорить — <span class="jp">コーヒーを飲みます。</span> уже понятно как «(я) выпью кофе».</p>`},

  {t:'explain',h:'Два типа прилагательных',html:`<p>В японском два класса прилагательных, и они ведут себя по-разному:</p>
   <p><b>い-прилагательные</b> заканчиваются на い и сами играют роль сказуемого:</p>
   <p class="jp" style="font-size:1.1rem">この本[ほん]は面白[おもしろ]いです。 — Эта книга интересная.</p>
   <p><b>な-прилагательные</b> перед существительным требуют な, а как сказуемое работают как существительное — через です:</p>
   <p class="jp" style="font-size:1.1rem">この部屋[へや]は静[しず]かです。 — Эта комната тихая.</p>
   <p class="jp" style="font-size:1.1rem">静[しず]かな部屋[へや] — тихая комната</p>
   <p>Осторожно: <span class="jp">きれい</span> «красивый» выглядит как い-прилагательное, но заканчивается на い из-за последнего слога れ<b>い</b> — это <b>な</b>-прилагательное: きれい<b>な</b>猫.</p>`},
  {t:'explain',h:'Отрицание, прошедшее, «нравится»',html:`<table class="examples">
    <tr><td class="jp-cell">面白い → 面白くないです</td><td>интересный → не интересный (い-тип)</td></tr>
    <tr><td class="jp-cell">面白かったです</td><td>было интересным (い-тип)</td></tr>
    <tr><td class="jp-cell">静か → 静かじゃありません</td><td>тихий → не тихий (な-тип)</td></tr>
    <tr><td class="jp-cell">静かでした</td><td>было тихим (な-тип)</td></tr>
   </table>
   <p><b>«Мне нравится».</b> 好き[すき]です — な-прилагательное. Тот, кто нравится, помечается частицей <b>が</b>:</p>
   <p class="jp" style="font-size:1.1rem">私は猫[ねこ]が好[す]きです。 — Я люблю кошек (мне нравятся кошки).</p>
   <p class="jp" style="font-size:1.1rem">アニメが好きです。 — Люблю аниме.</p>
   <p><b>が</b> — не «замена は». が здесь выделяет предмет чувства при прилагательных типа 好き、上手[じょうず]. Частицы は и が — разные инструменты, их полный разбор будет позже.</p>`},

 blocks:[
  {t:'explain',h:'Существование: あります и います',html:`<p>Два глагола «есть/находиться» — в зависимости от того, о чём речь:</p>
   <table class="examples">
    <tr><td class="jp-cell">机[つくえ]の上[うえ]に本[ほん]が<b>あります</b>。</td><td>На столе есть книга. (предмет)</td></tr>
    <tr><td class="jp-cell">猫[ねこ]は部屋[へや]に<b>います</b>。</td><td>Кошка в комнате. (живое существо)</td></tr>
   </table>
   <p>Схема: <b>место + に + что-то + が + あります/います</b>. Позиции внутри комнаты: 上[うえ] «наверху», 下[した] «внизу», 中[なか] «внутри», 隣[となり] «рядом». Соединитель между предметами — уже знакомая の: 机<b>の</b>上 «верх стола».</p>
   <p>Отрицание: <span class="jp">ありません</span> / <span class="jp">いません</span>: <span class="jp">教室[きょうしつ]に学生[がくせい]がいません。</span> «В классе нет студентов».</p>`},
  {t:'explain',h:'Где? и который час?',html:`<p>Вопрос «где?» — <span class="jp">どこ</span>. Он работает и про место, и про положение:</p>
   <table class="examples">
    <tr><td class="jp-cell">トイレはどこですか。</td><td>Где туалет? (トイレ — заимств. «туалет»)</td></tr>
    <tr><td class="jp-cell">学校[がっこう]はあそこです。</td><td>Школа вон там.</td></tr>
   </table>
   <p>Здесь/там/вон там: <span class="jp">ここ・そこ・あそこ</span> — та же трёхзонная схема, что у これ・それ・あれ, но про место.</p>
   <p>Время: <span class="jp">今[いま]、何時[なんじ]ですか。</span> «Сколько сейчас времени?» 何時 = 何 «что» + 時 «час».</p>`},

  {t:'explain',h:'Три группы глаголов',html:`<p>て-форма — «склейка» между предложениями и основа множества конструкций. Чтобы её образовать, сначала определите группу глагола:</p>
   <p><b>Группа 2 (слабые глаголы)</b> — проще всего: словарная форма заканчивается на <b>える / いる</b>, и просто る → て:</p>
   <p class="jp">食[た]べる → 食べて ・ 見[み]る → 見て ・ 寝[ね]る → 寝て</p>
   <p><b>Неправильные глаголы</b> — их два, формы надо запомнить:</p>
   <p class="jp">する → して ・ 来[く]る → 来[き]て</p>
   <p><b>Группа 1 (сильные глаголы)</b> — все остальные. Здесь る → て не работает, и правило зависит от последнего слога основы (см. следующий блок).</p>
   <p class="muted">Как отличить: если глагол заканчивается на える/いる — почти наверняка группа 2. Но есть «обманки» из группы 1, например 帰[かえ]る «возвращаться» — их запоминают по одному.</p>`},
  {t:'explain',h:'Группа 1: правило по последнему слогу',html:`<p>Отрежьте ます (или посмотрите на словарную форму) и смотрите на последний слог:</p>
   <table class="examples">

    <tr><td class="jp-cell">く → いて ・ ぐ → いで</td><td>書[か]く → 書いて ・ 泳ぐ → 泳いで</td></tr>
    <tr><td class="jp-cell">す → して</td><td>話[はな]す → 話して</td></tr>
   </table>
   <p>Внимание: в блоке む・ぶ・ぬ→んで 読む → 読んで — верно; а 泳ぐ из блока ぐ→いで.</p>
   <p><b>Главное исключение:</b> 行[い]く «идти» → <b>行って</b> (не 行いて!). Это единственный такой глагол, запомните его сразу.</p>
   <p class="muted">Мнемоника (учебная ассоциация, не этимология): う/つ/ру «выбивают» двойную って; м/б/н «звучат в нос» → んで; к/г «дают» い-связку.</p>`},

 blocks:[
  {t:'explain',h:'Длительное действие: て+います',html:`<p><b>て-форма + います</b> — действие происходит прямо сейчас («делаю <i>сейчас</i>»):</p>
   <p class="jp">今[いま]、何[なに]をしていますか。 — Что ты сейчас делаешь?</p>
   <p class="jp">昼[ひる]ご飯[はん]を食[た]べています。 — (Сейчас) обедаю.</p>

   <p>Отрицание: <span class="jp">今、何[なに]もしていません。</span>«Сейчас ничего не делаю». Отметьте: 何も «ничего» требует именно отрицания.</p>

  {t:'explain',h:'Разбор сцены',html:`<p>Реплики дружеские, но вежливые (です/ます) — так разговаривают приятели, не будучи близкими друзьями. Совсем разговорные формы (食べてる вместо 食べています) появятся позже.</p>

  {t:'explain',h:'Разбор сцены',html:`<p><b>Приглашение:</b> 行[い]きませんか — «не сходить ли?» — отрицательный вопрос звучит мягче утверждения. Согласие: <span class="jp">いいですね</span>.</p>
   <p><b>Мягкий отказ:</b> <span class="jp">3時はちょっと…</span> — предложение не отвергается напрямую, вместо «нет» — «в три — немного…», и сразу контрпредложение: <span class="jp">4時からにしませんか</span> «может, с четырёх?». Частица <b>から</b> после времени = «с (такого-то часа)».</p>
   <p><b>から — «потому что»:</b> ставится после причины, следствие идёт после:</p>
   <p class="jp">明日[あした]は忙[いそが]しいです。 = «завтра занят»</p>
   <p class="jp">明日は忙しいから、行きません。 — Завтра занят, поэтому не пойду.</p>
   <p><b>駅で待っています</b> — буквально «жду на вокзале (сейчас)», но по-русски естественно «буду ждать». Момент встречи — частый случай, когда ています переводится будущим.</p>
   <p>Регистр: герои на «вы-вежливо» (です/ます), но с дружескими частичками ねえ、じゃ — так звучит ровное дружеское общение. Романтические и грубо-разговорные регистры — будущие уроки.</p>`},

   {jp:'4時[よじ]からにしませんか。',ru:'Может, сделаем с четырёх?'},

  ]}

   <p>Объект желания может стоять и с を, и с が: 水を飲みたい / 水が飲みたい — оба варианта встречаются, разница тонкая, пока запомните を как безопасный вариант.</p>`},
  {t:'explain',h:'欲しい: «хочу иметь» и ませんか',html:`<p>Для предметов (и людей) — прилагательное <b>欲[ほ]しい</b>:</p>
   <p class="jp">新[あたら]しいパソコンが欲[ほ]しいです。 — Хочу новый компьютер.</p>

{
 id:'l13',title:'Мочь и уметь: ことができます',

 canDo:'После урока я могу сказать «умею плавать», «не могу прийти» и спросить о чьих-то умениях.',

 blocks:[
  {t:'explain',h:'〜ことができます: «могу / умею»',html:`<p>Словарная форма глагола + <b>こと</b> («вещь, действие») + が + <b>できます</b>:</p>
   <table class="examples">
    <tr><td class="jp-cell">泳[およ]ぐことができます。</td><td>Умею плавать (букв.: «плавание» возможно).</td></tr>
    <tr><td class="jp-cell">日本語[にほんご]を話[はな]すことができますか。</td><td>Вы умеете говорить по-японски?</td></tr>
    <tr><td class="jp-cell">料理[りょうり]をすることができます。</td><td>Умею готовить.</td></tr>
   </table>
   <p>こ と превращает глагол в существительное — поэтому конструкция работает как 好き/できます, которые ждут существительное: 泳ぐこと «плавание».</p>
   <p><b>Короткий вариант:</b> сам глагол できる «мочь, уметь, получаться»:</p>
   <p class="jp">ピアノができます。 — Умею играть на пианино.</p>
   <p class="jp">分[わ]かりましたか。— はい、分かりました。 — Понятно? — Да, понял.</p>
   <p><b>Отрицание:</b> ことができません «не могу, не умею»: <span class="jp">泳[およ]ぐことができません。</span></p>
   <p>Полезно в аниме-сценах: <span class="jp">できた！</span>«Получилось!», <span class="jp">できない…</span>«Не могу/не выходит…».</p>`},
  {t:'ex',items:[
   {jp:'泳[およ]ぐことができますか。',ru:'Умеете плавать?'},
   {jp:'ピアノができます。',ru:'Умею играть на пианино.'},
   {jp:'明日[あした]は来[く]ることができません。',ru:'Завтра не смогу прийти.'},
   {jp:'できました！',ru:'Получилось!'}
  ]},
  {t:'mistakes',items:[
   {bad:'泳ぎことができます',good:'泳ぐことができます',why:'Перед こと нужна словарная форма, не ます-основа.'},
   {bad:'ピアノをできます',good:'ピアノ<b>が</b>できます',why:'При できる то, что умеешь, — с が.'},
   {bad:'できることができます',good:'ピアノができます',why:'Не нагромождайте: できる сам по себе уже значит «могу/умею».'}
  ]}

 id:'l18',title:'Сравнения: より・のほうが・いちばん',
 goal:'Сравнивать вещи: «зимой холоднее, чем летом», «из двух люблю это», «самый любимый».',

 blocks:[
  {t:'explain',h:'AはBより…: «A …нее, чем B»',html:`<p>Частица <b>より</b> ставится после того, С ЧЕМ сравнивают:</p>
   <p class="jp">冬[ふゆ]は夏[なつ]より寒[さむ]い。 — Зимой холоднее, чем летом.</p>
   <p class="jp">電車[でんしゃ]はバスより早[はや]い。 — Поезд быстрее автобуса.</p>
   <p><b>Вопрос-выбор из двух:</b> <span class="jp">AとBとどちらが好きですか。</span>«Что любите больше — A или B?»</p>
   <p><b>Ответ-выбор:</b> <span class="jp">夏[なつ]の<b>ほうが</b>好[す]きです。</span>— «(Из двух) больше люблю лето». のほうが выделяет выбранную сторону.</p>
   <p><b>Самый:</b> <span class="jp">いちばん</span> — «больше всего, самый»:</p>
   <p class="jp">これが一番[いちばん]好[す]きなアニメ。 — Это моё самое любимое аниме.</p>
   <p>С этим работают прилагательные-оценки: 上手[じょうず] «умело», 下手[へた] «неумело», 嫌[きら]い «не нравится» (антоним 好き).</p>`},
  {t:'ex',items:[
   {jp:'冬[ふゆ]は夏[なつ]より寒[さむ]い。',ru:'Зимой холоднее, чем летом.'},
   {jp:'夏[なつ]と冬[ふゆ]とどちらが好[す]き？',ru:'Что любишь больше — лето или зиму?'},
   {jp:'夏[なつ]のほうが好[す]き。',ru:'Больше люблю лето.'},
   {jp:'これが一番[いちばん]好[す]きなアニメ。',ru:'Это самое любимое аниме.'}
  ]},
  {t:'mistakes',items:[

  {t:'explain',h:'〜たり〜たり: «то…, то…»',html:`<p><b>た-форма + り</b> перечисляет несколько действий <b>из многих</b> (не полный список):</p>
   <p class="jp">日曜[にちよう]日は掃除[そうじ]したり、散歩[さんぽ]したりしました。</p>
   <p>— В воскресенье то убирался, то гулял (и ещё что-то делал).</p>
   <p class="jp">休[やす]みには釣[つ]りをしたり、本[ほん]を読[よ]んだりします。</p>
   <p>— В выходные то рыбачу, то читаю.</p>
   <p>Механика: взяли た-форму (урок 17) и добавили り, в конце — します/しました. Это <b>неполное</b> перечисление: «и тому подобное».</p>`},
  {t:'dialogue',h:'Сцена: прощание у поезда',lines:[
   {who:'ゆき',jp:'明日[あした]はもう帰[かえ]るんだね。寂[さび]しいな…',ru:'Завтра ты уже уезжаешь… Грустно.'},
   {who:'けん',jp:'僕[ぼく]も。三年[さんねん]間[かん]、たくさん遊[あそ]んだり、笑[わら]ったりしたね。',ru:'Мне тоже. Три года — много играли, много смеялись.'},
   {who:'ゆき',jp:'思[おも]い出[で]がいっぱいできた。忘[わす]れないよ。',ru:'Появилась куча воспоминаний. Не забуду.'},
   {who:'けん',jp:'手紙[てがみ]を書[か]くよ。写真[しゃしん]も送[おく]る。',ru:'Буду писать письма. И фото отправлять.'},
   {who:'ゆき',jp:'泣[な]いちゃう…「さようなら」じゃなくて、「またね」って言[い]おう。',ru:'Сейчас расплачусь… Давай не «до свидания», а «до встречи».',note:'泣いちゃう — разговорное сжатие от 泣いてしまう «расплакаться (невзначай)»'},
   {who:'けん',jp:'そうだね。元気[げんき]でね。またね！',ru:'Да, ты прав. Будь здоров. До встречи!'}
  ]},
  {t:'explain',h:'Разбор сцены',html:`<p><b>さようなら — тяжёлое «прощание»</b> (надолго или навсегда), поэтому герои сознательно выбирают лёгкое <span class="jp">またね</span>«до встречи» и <span class="jp">元気[げんき]でね</span>«будь здоров». Так говорят в трогательных сценах аниме.</p>
   <p><b>〜たり〜たり</b> в реплике Кэна — итог трёх лет: 遊[あそ]んだり、笑[わら]ったりした «и играли, и смеялись (и не только)».</p>
   <p><b>って</b> — разговорное сжатие と言[い]って: <span class="jp">「またね」<b>って</b>言[い]おう</span>«скажем „до встречи“». Встречается в каждой второй серии.</p>
   <p><b>Регистр:</b> простая форма + мягкие частицы ね・な. 寂しいな — вздох «грустно-то как…».</p>`},
  {t:'mistakes',items:[
   {bad:'掃除したり、散歩しました (половина конструкции)',good:'掃除したり、散歩したりしました',why:'〜たり ставится после КАЖДОГО действия из списка.'},
   {bad:'さようなら！(другу в соцсетях)',good:'またね / じゃあね',why:'さようなる — прощание надолго; в быту — またね、じゃあね、バイバイ.'},

{
 id:'l20',title:'Сцена «Задание в гильдии» (фэнтези)',

 blocks:[
  {t:'dialogue',h:'Сцена: зал гильдии',lines:[
   {who:'まほうつかい',jp:'ギルドに新[あたら]しい試練[しれん]が来[き]たよ。聞[き]いた？',ru:'В гильдию поступило новое испытание. Слышал?'},
   {who:'ゆうしゃ',jp:'ああ。昔[むかし]の竜[りゅう]が戻[もど]ってきたんだって。',ru:'Ага. Говорят, вернулся дракон из старины.',note:'〜んだって — «говорят, что…»'},
   {who:'けんじゃ',jp:'危険[きけん]だ。だが、力[ちから]を合[あ]わせれば勝[か]てる。',ru:'Опасно. Но объединив силы — победим.',note:'力を合わせる — «объединить силы» (устойчивое)'},
   {who:'まほうつかい',jp:'賢者[けんじゃ]の話[はなし]では、この竜[りゅう]は火[ひ]より水[みず]のほうが弱[よわ]いそうだ。',ru:'По словам мудреца, этот дракон слабее к воде, чем к огню.',note:'〜によると／〜の話では — «по словам…»; сравнение のほうが'},
   {who:'ゆうしゃ',jp:'よし。僕[ぼく]の剣[けん]も、前[まえ]より強[つよ]くなった。行[い]くぞ！',ru:'Так. Мой меч тоже стал сильнее, чем раньше. Погнали!'},
   {who:'まほうつかい',jp:'勝[か]って、宝物[たからもの]を見[み]つけよう！',ru:'Победим и найдём сокровище!'}
  ]},
  {t:'explain',h:'Разбор сцены',html:`<p><b>Фэнтезийный словарь:</b> ギルド «гильдия», 試練[しれん] «испытание」, 竜[りゅう] «дракон» (японское слово, рядом с заимствованным ドラゴン), 火[ひ] «огонь», 賢者[けんじゃ] «мудрец».</p>
   <p><b>Сравнение двух стихий:</b> 火より水のほうが弱い — «к воде слабее, чем к огню»: より (эталон) + のほうが (выбранное) в одном предложении — типичная схема для уязвимостей монстров.</p>
   <p><b>Прошедшее + сравнение:</b> 前[まえ]より強[つよ]くなった — «стал сильнее, чем раньше»: なった — прошедшее от なる «становиться».</p>
   <p><b>Разговорные сокращения:</b> 〜んだって «говорят», 勝[か]てる «сможем победить» (форма возможности, подробно — позже), 見[み]つけよう «давай найдём» (волитивная форма — узнайте на слух).</p>
   <p><b>Регистр:</b> отряд разговаривает просто, но けんじゃ говорит чуть книжнее (だが, 危険だ) — так отличают «мудреца» в аниме.</p>`},
  {t:'ex',items:[
   {jp:'昔[むかし]の竜[りゅう]が戻[もど]ってきた。',ru:'Вернулся дракон из старины.'},
   {jp:'火[ひ]より水[みず]のほうが弱[よわ]い。',ru:'К воде слабее, чем к огню.'},
   {jp:'力[ちから]を合[あ]わせて勝[か]つ。',ru:'Объединив силы, победим.'},
   {jp:'前[まえ]より強[つよ]くなった。',ru:'Стал сильнее, чем раньше.'}
  ]},
  {t:'mistakes',items:[

'use strict';
/* ============================================================
   UI-слой: маршрутизация, экраны, сеансы, TTS.
   ============================================================ */
const $app=document.getElementById('app');
let SCREEN={name:'today',params:{}};
let SESSION=null;       // текущий сеанс (урок/повторение/диагностика)
let lastActivity=Date.now();

/* ---------- Вспомогательные ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600);}
function levelOf(xp){return Math.floor(Math.sqrt((xp||0)/40))+1;}
function xpForLevel(l){return 40*(l-1)*(l-1);}
function stableWords(){return Object.values(STATE.cards).filter(c=>c.ivl>=21).length;}
function totalWords(){return Object.keys(STATE.cards).length;}

/* ---------- TTS ---------- */
let VOICES=[];
function hasJaVoice(){return VOICES.length>0;}
function initVoices(){
  if(!('speechSynthesis' in window)){VOICES=[];return;}
  const all=speechSynthesis.getVoices();
  VOICES=all.filter(v=>/^ja([-_]|$)/i.test(v.lang)||(v.lang||'').toLowerCase().startsWith('ja'));
  const sel=document.getElementById('voice-select');
  if(sel){
    sel.innerHTML=VOICES.length
      ? VOICES.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===STATE.settings.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')
      : '<option value="">— японские голоса не найдены —</option>';
  }
  updateVoiceWarning();
}
function updateVoiceWarning(){
  const w=document.getElementById('voice-warning');
  if(w) w.style.display=hasJaVoice()?'none':'block';
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged=initVoices;
  initVoices(); setTimeout(initVoices,300); setTimeout(initVoices,1500);
}
function speak(text){
  if(!('speechSynthesis' in window)||!hasJaVoice()) return false;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(stripFuri(text));
    const v=VOICES.find(x=>x.voiceURI===STATE.settings.voiceURI)||VOICES[0];
    if(v)u.voice=v;
    u.lang='ja-JP'; u.rate=STATE.settings.rate||0.9;
    speechSynthesis.speak(u);
    return true;
  }catch(e){return false;}
}

/* ---------- Применение настроек ---------- */
function applySettings(){
  document.documentElement.setAttribute('data-theme',STATE.settings.theme);
  document.documentElement.setAttribute('data-accent',STATE.settings.accent||'indigo');
  document.documentElement.setAttribute('data-furigana',STATE.settings.furigana);
}

/* ---------- Учёт активного времени ---------- */
document.addEventListener('click',()=>{lastActivity=Date.now();});
document.addEventListener('keydown',()=>{lastActivity=Date.now();});
setInterval(()=>{
  if(document.visibilityState==='visible'&&(Date.now()-lastActivity)<150000&&SESSION){
    const k=dayKey();
    STATE.log[k]=STATE.log[k]||{answers:0,correct:0,reviews:0,minutes:0};
    STATE.log[k].minutes=(STATE.log[k].minutes||0)+1;

},60000);

/* ---------- Каркас экрана ---------- */
const TABS=[['today','Сегодня'],['course','Курс'],['review','Повторения'],['lab','Лаборатория'],['stats','Статистика'],['settings','Настройки']];
function shell(content,active){
  const inSession=SESSION&&SESSION.kind;
  return `<div class="top"><div class="hanko">今日</div>
    <div><div class="title">Японский: путь к аниме</div>

    ${inSession?'':`<nav class="tabs">${TABS.map(([id,l])=>
      `<button data-go="${id}" ${id===active?'aria-current="page"':''}>${l}</button>`).join('')}</nav>`}
    ${content}`;
}
function go(name,params){SCREEN={name,params:params||{}};SESSION=null;render();}
function render(){applySettings();
  if(SCREEN.name==='today')renderToday();
  else if(SCREEN.name==='course')renderCourse();
  else if(SCREEN.name==='review')renderReviewHome();
  else if(SCREEN.name==='lab')renderLab();
  else if(SCREEN.name==='stats')renderStats();
  else if(SCREEN.name==='settings')renderSettings();
  else renderToday();
  window.scrollTo(0,0);
}
$app.addEventListener('click',e=>{
  const b=e.target.closest('[data-go]');
  if(b){go(b.dataset.go);}
});
document.getElementById('toast');

/* ---------- Планирование ---------- */
function nextLessonIndex(){
  for(let i=0;i<LESSONS.length;i++){
    const st=(STATE.lessons[LESSONS[i].id]||{}).status;
    if(st!=='done')return i;
  }
  return -1;
}
function lessonUnlocked(i){return i===0||(STATE.lessons[LESSONS[i-1].id]||{}).status==='done';}
function dueCards(){
  const now=Date.now();
  return Object.values(STATE.cards).filter(c=>!c.suspended&&(c.due||0)<=now).sort((a,b)=>(a.due||0)-(b.due||0));
}
function newCandidates(){
  const seen=new Set(Object.keys(STATE.cards));
  const out=[];
  for(let i=0;i<LESSONS.length;i++){
    if(!lessonUnlocked(i))break;
    for(const wid of LESSONS[i].words)if(!seen.has(wid))out.push(wid);
  }
  return out;
}
function planFor(mode){
  const due=dueCards().length,newN=newCandidates().length,next=nextLessonIndex();
  const rep=`Повторения карточек — ${due} к повторению`;
  const less=next>=0?`Урок ${next+1}: ${LESSONS[next].title}`:'Уроки пройдены — закрепление';
  if(mode===15)return[rep,`${less} (сокращённо: только объяснение)`,`Аудирование — 1–2 фразы`];
  if(mode===60)return[`Повторения — ${Math.max(5,Math.round(mode*0.25))} мин`],null; // не используется
  return[rep,less,'Упражнения урока','Аудирование фраз урока','Повтор за голосом (если есть голос)'];
}
function planBlocks(mode){
  const due=dueCards().length;
  const next=nextLessonIndex();
  const L=(m)=>[
    {min:'15 мин',t:`Повторения карточек (сейчас к повторению: ${due})`},
    {min:'20 мин',t:next>=0?`Новая тема: урок ${next+1} — ${LESSONS[next].title}`:'Повторение пройденных тем'},
    {min:'15 мин',t:'Упражнения урока'},
    {min:'20 мин',t:'Аудирование: фразы урока за голосом'},
    {min:'10 мин',t:'Чтение примеров вслух'},
    {min:'10 мин',t:'Разбор ошибок недели'}];
  const S=(m)=>[
    {min:'5 мин',t:`Повторения карточек (${due} к повторению)`},
    {min:'7 мин',t:next>=0?`Урок ${next+1}: главное объяснение`:'Повторение тем'},
    {min:'5 мин',t:'3–5 упражнений'},
    {min:'3 мин',t:'Аудирование: 2 фразы'}];
  return mode===15?S():L();
}

/* ---------- Экран «Сегодня» ---------- */
function renderToday(){
  const h=new Date().getHours();
  const jpH=h<11?'おはようございます':h<18?'こんにちは':'こんばんは';
  const ruH=h<11?'Доброе утро':h<18?'Добрый день':'Добрый вечер';
  const due=dueCards().length;
  const next=nextLessonIndex();
  const started=next>=0&&(STATE.lessons[LESSONS[next].id]||{}).status==='started';
  const mode=(SCREEN.params&&SCREEN.params.mode)||15;
  const streak=streakDays(STATE.log);
  const lvl=levelOf(STATE.xp);
  let html=`
   <div class="hero"><div><div class="big-day jp">${jpH}</div>
   <h1>${ruH}! ${streak?`Серия: ${streak} 🔥`:'Начнём сегодня?'}</h1></div></div>
   <div class="stat-chips">
    <div class="stat"><b>${lvl}</b><span>уровень (опыт ${STATE.xp||0})</span></div>
    <div class="stat"><b>${totalWords()}</b><span>слов в колоде</span></div>
    <div class="stat"><b>${stableWords()}</b><span>закреплено (интервал ≥ 21 дн.)</span></div>
    <div class="stat"><b>${due}</b><span>к повторению</span></div>
   </div>`;
  if(!STATE.diag.done){
    html+=`<div class="card"><h3>Сначала — короткая диагностика каны</h3>
     <p class="muted">14 вопросов, 2–3 минуты. Знакомая хирагана не заставит проходить лишнее: по результату маршрут подстроится.</p>
     <button class="btn big" data-action="start-diag">Пройти диагностику</button></div>`;
  }else{
    const route=makeRoute(STATE.diag);
    html+=`<div class="card"><h3>Маршрут по диагностике</h3>
     ${route.notes.map(n=>`<p class="muted">• ${n}</p>`).join('')}
     <button class="btn small ghost" data-action="start-diag">Пройти заново</button></div>`;
    html+=`<div class="card">
     ${next>=0?`<button class="btn big" data-action="start-lesson" data-id="${LESSONS[next].id}">${started?'Продолжить урок':'Начать занятие'}: урок ${next+1} — ${esc(LESSONS[next].title)}</button>`
       :`<button class="btn big" data-action="review">Повторения — все уроки пройдены</button>`}
     <p class="muted" style="margin-top:10px">${due>0?`Также к повторению сейчас ${due} карточек.`:'К повторению пока ничего не подошло — новые карточки появятся после уроков.'}</p>
     ${due>0?`<button class="btn ghost" data-action="review" style="margin-top:8px">Повторения (${due})</button>`:''}
    </div>`;
    const examReady=(()=>{for(const E of EXAMS){if(examUnlocked(E)&&(STATE.exams[E.id]||{}).status!=='done')return E;}return null;})();
    if(examReady){html+=`<div class="card"><h3>Доступна контрольная работа</h3>
     <p class="muted">${esc(examReady.title)} — 12 случайных заданий из модуля, порог 75%. Новые слова из контрольной в колоду не добавляются.</p>
     <button class="btn big" data-action="start-exam" data-id="${examReady.id}">Начать контрольную</button></div>`;}
    html+=`<div class="card"><h3>План на сегодня — ${mode===15?'сокращённый (15–20 мин)':mode+' минут'}</h3>
     <div class="row">${[15,60,90,120].map(m=>`<button class="btn small ${m===mode?'':'ghost'}" data-action="set-mode" data-mode="${m}">${m===15?'15–20 мин':m+' мин'}</button>`).join('')}</div>
     <ul class="plan-list">${planBlocks(mode).map(b=>`<li><span class="min">${b.min}</span><span>${b.t}</span></li>`).join('')}</ul>
     <p class="muted">Это ориентир, а не таймер: можно закончить в любой момент, «долгов» и штрафов за пропуск нет.</p></div>`;
  }
  html+=`<div class="card"><h3>Облачная синхронизация</h3>
   <p class="muted">Сейчас прогресс хранится <b>только локально</b> в этом браузере. Облачная синхронизация ещё не подключена и появится позже. Перенос между устройствами — через <b>Настройки → Экспорт/Импорт</b> (это резервная копия, а не автоматическая синхронизация).</p></div>`;
  $app.innerHTML=shell(html,'today');
  bindToday();
}
function bindToday(){
  $app.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{
    const a=b.dataset.action;
    if(a==='start-diag')startDiag();
    else if(a==='start-lesson')startLesson(b.dataset.id);
    else if(a==='review')startReview();
    else if(a==='set-mode')go('today',{mode:+b.dataset.mode});
    else if(a==='start-exam')startExam(b.dataset.id);
  }));
}

/* ---------- Курс ---------- */
function renderCourse(){
  let html='<div class="card"><h2>Карта курса</h2><p class="muted">Этапы A→B→C: восстановление письменности и начальная грамматика. Дальнейшие уроки добавляются как учебные пакеты (контент v'+CONTENT_VERSION+'). Соответствие уровням JLPT — приблизительное; это не официальный курс JLPT.</p></div>';
  html+='<div class="course-list">';
  html+=`<div class="course-item ${STATE.diag.done?'done':'active'}" data-go="${STATE.diag.done?'':'diag'}" data-action="diag">
    <div class="num">${STATE.diag.done?'✓':'!'}</div>
    <div class="meta"><b>Диагностика каны</b><span class="muted">${STATE.diag.done?'Пройдена':'Хирагана, катакана, похожие знаки'}</span></div></div>`;
  LESSONS.forEach((L,i)=>{
    const st=(STATE.lessons[L.id]||{}).status;
    const unlocked=lessonUnlocked(i);
    const cls=st==='done'?'done':unlocked?'active':'locked';
    html+=`<div class="course-item ${cls}" ${unlocked?`data-action="start-lesson" data-id="${L.id}"`:''}>
     <div class="num">${st==='done'?'✓':i+1}</div>
     <div class="meta"><b>${esc(L.title)}</b>
      <span class="muted">${esc(L.goal)}</span><br>
      <span class="locked-note">${st==='done'?'Пройден':unlocked?'Доступен':'Откроется после предыдущего урока'} · ${L.exercises.length} заданий</span></div></div>`;
    const E=EXAMS.find(e=>e.lessons[e.lessons.length-1]===L.id);
    if(E){
      const est=(STATE.exams[E.id]||{}).status;
      const eun=examUnlocked(E);
      const ecls=est==='done'?'done':eun?'active':'locked';
      html+=`<div class="course-item ${ecls}" ${eun?`data-action="start-exam" data-id="${E.id}"`:''}>
       <div class="num">${est==='done'?'✓':'✎'}</div>
       <div class="meta"><b>${esc(E.title)}</b>
        <span class="muted">12 случайных заданий из модуля · порог 75% · пересдача без ограничений</span><br>
        <span class="locked-note">${est==='done'?'Сдана':eun?'Доступна':'Откроется после уроков модуля'}</span></div></div>`;
    }
  });
  html+='</div>';
  html+=`<div class="card locked-note">Этапы 2–3: уроки 1–23 (12 сцен-диалогов), контрольные, лаборатория субтитров, импорт Anki, колода кандзи. Далее: PWA, облако.</div>`;
  $app.innerHTML=shell(html,'course');
  bindCourse();
}
function bindCourse(){
  $app.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{
    const a=b.dataset.action;
    if(a==='start-lesson')startLesson(b.dataset.id);
    else if(a==='diag')startDiag();
  }));
}

/* ---------- Диагностика ---------- */
function startDiag(){
  SESSION={kind:'diag',i:0,answers:Array(DIAG.items.length).fill(null),hiraOk:0,kataOk:0};
  renderDiag();
}
function renderDiag(){
  const it=DIAG.items[SESSION.i];
  const isType=it.kind==='hira-type'||it.kind==='kata-type';
  const html=`<div class="lesson-step">
   <div class="spread"><span class="badge">Вопрос ${SESSION.i+1} из ${DIAG.items.length}</span><button class="btn small ghost" id="quit-diag">Прервать</button></div>
   <div class="progress-bar"><div style="width:${(SESSION.i/DIAG.items.length)*100}%"></div></div>
   <div class="card"><span class="badge">${it.kind.startsWith('kata')?'катакана':'хирагана'}</span>
    <p class="q-prompt">${it.q}</p><span class="q-jp">${esc(it.jp)}</span>
    ${isType
      ?`<input class="type-in" id="diag-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="например: nu" style="font-family:var(--font-ui)">
        <p class="muted">Введите чтение латиницей (ромадзи).</p>
        <div id="diag-fb"></div><button class="btn big" id="diag-check">Проверить</button>`
      :`<div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`}
   </div></div>`;
  $app.innerHTML=shell(html,null);
  document.getElementById('quit-diag').onclick=()=>{if(confirm('Прервать диагностику? Результат не сохранится.')){SESSION=null;go('course');}};
  if(isType){
    const inp=document.getElementById('diag-input');inp.focus();
    const check=()=>{
      const ok=it.accept.includes(inp.value.trim().toLowerCase());
      if(ok){SESSION[SESSION.i]=null;answerDiagType(ok,it);}
      else{
        document.getElementById('diag-fb').innerHTML=`<div class="feedback bad"><b>Неверно.</b> Правильное чтение: <b>${esc(it.accept[0])}</b>. Знак добавлен в повторения.</div>`;
        answerDiagType(false,it);
      }
    };
    document.getElementById('diag-check').onclick=check;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  }else{
    $app.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answerDiag(+b.dataset.i)));
  }
}
function answerDiag(i){answerDiagType(i===DIAG.items[SESSION.i].answer,DIAG.items[SESSION.i]);}
function answerDiagType(ok,it){
  SESSION.answers[SESSION.i]=ok?1:0;
  if(ok){
    if(it.kind.startsWith('hira'))SESSION.hiraOk++;else SESSION.kataOk++;
  }else if(it.jp.length<=2){
    const key='k_'+it.jp;
    if(!STATE.cards[key])STATE.cards[key]=newCard(key);
    KANA_READINGS[it.jp]&&(STATE.cards[key].ru=KANA_READINGS[it.jp]);
  }
  SESSION.i++;
  queueSave();
  if(SESSION.i<DIAG.items.length)renderDiag();
  else finishDiag();
}
function finishDiag(){
  const hiraN=DIAG.items.filter(x=>x.kind==='hira').length;
  const kataN=DIAG.items.length-hiraN;
  STATE.diag={done:true,hira:SESSION.hiraOk/hiraN,kata:SESSION.kataOk/kataN,
    weak:Object.keys(STATE.cards).filter(k=>k.startsWith('k_')).map(k=>k.slice(2))};
  // Прочитаем ru для добавленных карточек каны
  for(const k of Object.keys(STATE.cards))if(k.startsWith('k_')&&!STATE.cards[k].ru)STATE.cards[k].ru=KANA_READINGS[k.slice(2)]||k.slice(2);
  queueSave();
  const route=makeRoute(STATE.diag);
  $app.innerHTML=shell(`<div class="lesson-step"><div class="card">
   <h2>Диагностика завершена</h2>
   <p>Хирагана: ${Math.round(STATE.diag.hira*100)}% · Катакана: ${Math.round(STATE.diag.kata*100)}%</p>
   ${route.notes.map(n=>`<p class="muted">• ${n}</p>`).join('')}
   <p class="muted">Слабые знаки добавлены в колоду повторений — они будут появляться в коротких ежедневных сессиях.</p>
   <button class="btn big" data-go="today">На главный экран</button></div></div>`,null);
  SESSION=null;
}

/* ---------- Урок ---------- */
function startLesson(id){
  const L=LESSONS.find(l=>l.id===id);
  SESSION={kind:'lesson',L,step:0,phase:'blocks',exIdx:0,correct:0,answered:0,locked:true};
  renderLessonStep();
}
function renderLessonStep(){
  const L=SESSION.L;
  if(SESSION.phase==='blocks'){
    if(SESSION.step>=L.blocks.length){SESSION.phase='exercises';SESSION.exIdx=0;}
    else{
      const b=L.blocks[SESSION.step];
      let inner='';
      if(b.t==='explain')inner=`<h2>${esc(b.h)}</h2><div class="ex-plain">${b.html}</div>`;
      else if(b.t==='ex')inner=`<h2>Примеры</h2><table class="examples">${b.items.map(x=>
        `<tr><td class="jp-cell">${renderFuri(x.jp)}</td><td>${esc(x.ru)}${x.note?`<br><span class="muted">${esc(x.note)}</span>`:''}</td></tr>`).join('')}</table>`;
      else if(b.t==='dialogue')inner=`<h2>${esc(b.h)}</h2><table class="examples">${b.lines.map(x=>
        `<tr><td class="jp-cell" style="white-space:normal"><b>${esc(x.who)}:</b> ${renderFuri(x.jp)}</td><td>${esc(x.ru)}${x.note?`<br><span class="muted">${esc(x.note)}</span>`:''}</td></tr>`).join('')}</table>`;
      else if(b.t==='mistakes')inner=`<h2>Типичные ошибки</h2>${b.items.map(m=>
        `<div class="mistake"><span class="bad-ans jp">${esc(m.bad)}</span> → <span class="good-ans jp">${esc(m.good)}</span><br><span class="muted">${esc(m.why)}</span></div>`).join('')}`;
      const last=SESSION.step===L.blocks.length-1;
      $app.innerHTML=shell(`<div class="lesson-step">
       <div class="progress-bar"><div style="width:${(SESSION.step/(L.blocks.length+2))*100}%"></div></div>
       <div class="card">${inner}</div>
       <button class="btn big" id="next-block">${last?'К заданиям':'Дальше'}</button>
       <button class="btn ghost" id="quit-lesson" style="margin-top:10px;width:100%">Выйти (прогресс шагов сохранится частично)</button>
      </div>`,null);
      document.getElementById('next-block').onclick=()=>{SESSION.step++;renderLessonStep();};
      document.getElementById('quit-lesson').onclick=()=>{SESSION=null;go('course');};
      return;
    }
  }
  if(SESSION.phase==='exercises'){
    if(SESSION.exIdx>=L.exercises.length){finishLesson();return;}
    renderExercise(L.exercises[SESSION.exIdx]);
    return;
  }
}
/* ---------- Упражнения ---------- */
function renderExercise(ex){
  const list=currentExList();
  const prog=((SESSION.exIdx)/list.length)*100;
  let body='';
  if(ex.type==='choice'){
    body=`<p class="q-prompt">${ex.q}</p>
     ${ex.jp?`<span class="q-jp">${renderFuri(ex.jp)}</span>`:''}
     <div class="opts">${ex.options.map((o,i)=>`<button class="opt ${ex.jpOptions?'jp-opt':''}" data-i="${i}">${renderFuri(o)}</button>`).join('')}</div>`;
  }else if(ex.type==='assemble'){
    SESSION._picked=[];
    body=`<p class="q-prompt">${ex.q}</p>
     <div class="assemble-line" id="ans-line"></div>
     <div class="row" id="tok-row">${shuffle(ex.tokens).map((t,i)=>`<button class="token" data-i="${i}">${esc(t)}</button>`).join('')}</div>`;
  }else if(ex.type==='input'){
    body=`<p class="q-prompt">${ex.q}</p>
     ${ex.jp?`<span class="q-jp">${renderFuri(ex.jp)}</span>`:''}
     <input class="type-in jp" id="type-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ひらがな…">
     <p class="muted">Ответ вводится хираганой.</p>`;
  }else if(ex.type==='match'){
    SESSION._selL=null;SESSION._donePairs=0;
    body=`<p class="q-prompt">${ex.q}</p>
     <div class="match-grid">
      <div>${ex.pairs.map((p,i)=>`<button class="opt jp-opt m-left" data-i="${i}" style="width:100%;margin-bottom:8px">${esc(p[0])}</button>`).join('')}</div>
      <div>${shuffle(ex.pairs.map((p,i)=>i)).map(i=>`<button class="opt m-right" data-i="${i}" style="width:100%;margin-bottom:8px">${esc(ex.pairs[i][1])}</button>`).join('')}</div>
     </div>`;
  }else if(ex.type==='listen'){
    const noVoice=!hasJaVoice();
    body=`<p class="q-prompt">${ex.q}</p>
     ${noVoice?`<div class="audio-note">Японский голос не найден в системе, звук не воспроизведётся. Задание показано в текстовом виде и <b>не засчитывается как аудирование</b> (установите японский голос TTS в системе или выберите его в настройках).</div><span class="q-jp">${renderFuri(ex.say)}</span>`
       :`<div class="row" style="justify-content:center;margin:14px 0"><button class="play-btn" id="play-btn">▶</button></div>
         <p class="muted" style="text-align:center">Слушайте и выбирайте перевод. Можно прослушать несколько раз.</p>`}
     <div class="opts" ${noVoice?'':'style="opacity:.45;pointer-events:none"'} id="listen-opts">
      ${ex.options.map((o,i)=>`<button class="opt" data-i="${i}">${renderFuri(o)}</button>`).join('')}</div>`;
  }
  const isExam=SESSION.kind==='exam';
  const headBadge=isExam?`<span class="badge">Контрольная: задание ${SESSION.exIdx+1} из ${list.length}</span>
    <button class="btn small ghost" id="quit-exam">Прервать</button>`
   :`<span class="badge">Задание ${SESSION.exIdx+1} из ${list.length}</span>
    <button class="btn small ghost" id="quit-lesson-ex">Прервать</button>
    <button class="btn small ghost" data-action="report">Сообщить об ошибке в задании</button>`;
  $app.innerHTML=shell(`<div class="lesson-step">
   <div class="spread">${headBadge}</div>
   <div class="progress-bar"><div style="width:${prog}%"></div></div>
   ${isExam?'<div class="audio-note">Контрольная работа: порог — 75%. Новые слова в колоду не добавляются. Пересдача доступна сразу после завершения.</div>':''}
   <div class="card">${body}</div>
   <div id="fb-slot"></div>
  </div>`,null);
  if(isExam)$app.querySelector('#quit-exam').onclick=()=>{SESSION=null;go('course');};
  const qex=$app.querySelector('#quit-lesson-ex');
  if(qex)qex.onclick=()=>{if(confirm('Прервать урок? Прогресс этого урока не сохранится.')){SESSION=null;go('course');}};
  const checkBtnHtml=()=>`<button class="btn big" id="check-btn">Проверить</button>`;
  if(ex.type==='choice'||ex.type==='listen'){
    let sel=null;
    const opts=$app.querySelectorAll('.opt');
    opts.forEach(b=>b.addEventListener('click',()=>{
      opts.forEach(x=>x.classList.remove('selected'));b.classList.add('selected');sel=+b.dataset.i;
      if(!document.getElementById('check-btn'))document.getElementById('fb-slot').innerHTML=checkBtnHtml(),bindCheck();
    }));
    const pb=document.getElementById('play-btn');
    if(pb) pb.onclick=()=>{
        if(speak(ex.say)){
          const o=document.getElementById('listen-opts');
          o.style.opacity='1';o.style.pointerEvents='auto';
          SESSION._audioPlayed=true;
        }else toast('Не удалось воспроизвести звук');
      };
    SESSION._audioPlayed=false;
    function bindCheck(){
      document.getElementById('check-btn').onclick=()=>{
        if(ex.type==='listen'&&!SESSION._audioPlayed&&!hasJaVoice()){/* текстовый режим */}
        if(sel===null){toast('Выберите вариант');return;}
        gradeExercise(sel===ex.answer,ex.type==='listen'&&!SESSION._audioPlayed);
        showFeedback(sel===ex.answer,ex);
      };
    }
    bindCheck();
  }else if(ex.type==='assemble'){
    const toks=$app.querySelectorAll('.token');
    toks.forEach(b=>b.addEventListener('click',()=>{
      if(b.classList.contains('in-answer')){b.classList.remove('in-answer');
        SESSION._picked=SESSION._picked.filter(x=>x!==b);}
      else{b.classList.add('in-answer');SESSION._picked.push(b);}
      document.getElementById('ans-line').innerHTML=SESSION._picked.map(x=>`<span class="token in-answer">${x.textContent}</span>`).join('');
      if(!document.getElementById('check-btn')){document.getElementById('fb-slot').innerHTML=checkBtnHtml();bindCheck2();}
    }));
    function bindCheck2(){
      document.getElementById('check-btn').onclick=()=>{
        if(!SESSION._picked.length){toast('Соберите предложение');return;}
        const ans=SESSION._picked.map(b=>b.textContent).join('');
        const ok=normalizeAnswer(ans)===normalizeAnswer(ex.answer);
        gradeExercise(ok,false);showFeedback(ok,ex);
      };
    }
  }else if(ex.type==='input'){
    const inp=document.getElementById('type-in');inp.focus();
    document.getElementById('fb-slot').innerHTML=checkBtnHtml();
    document.getElementById('check-btn').onclick=()=>{
      const ok=checkInput(inp.value,ex.accept);
      gradeExercise(ok,false);showFeedback(ok,ex,inp.value);
    };
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('check-btn').click();});
  }else if(ex.type==='match'){
    const lefts=$app.querySelectorAll('.m-left'),rights=$app.querySelectorAll('.m-right');
    lefts.forEach(b=>b.addEventListener('click',()=>{lefts.forEach(x=>x.classList.remove('selected'));b.classList.add('selected');SESSION._selL=b;}));
    rights.forEach(b=>b.addEventListener('click',()=>{
      if(!SESSION._selL){toast('Сначала выберите слово слева');return;}
      const li=+SESSION._selL.dataset.i,ri=+b.dataset.i;
      if(li===ri){b.classList.add('correct');SESSION._selL.classList.add('correct');
        SESSION._selL.disabled=true;b.disabled=true;SESSION._donePairs++;
        if(SESSION._donePairs===ex.pairs.length){gradeExercise(true,false);showFeedback(true,ex);}
      }else{
        SESSION._selL.classList.add('wrong');b.classList.add('wrong');
        setTimeout(()=>{b.classList.remove('wrong');if(SESSION._selL)SESSION._selL.classList.remove('wrong');},700);
      }
      SESSION._selL=null;
    }));
    $app.querySelectorAll('.m-left.correct,.m-right.correct').forEach(x=>x.disabled=true);
  }
  const rep=$app.querySelector('[data-action="report"]');
  if(rep)rep.onclick=()=>{
    const t=prompt('Опишите ошибку в задании (сохранится в приложении, можно экспортировать):');
    if(t){STATE.reports.push({exId:ex.id,at:Date.now(),text:t});queueSave();toast('Спасибо! Заметка сохранена в Настройках.');}
  };
}
function currentExList(){return SESSION.kind==='exam'?SESSION.exList:SESSION.L.exercises;}
function gradeExercise(ok,notCounted){
  SESSION.answered++;
  if(ok)SESSION.correct++;
  else STATE.mistakes.push({exId:currentExList()[SESSION.exIdx].id,at:Date.now()});
  if(!notCounted){
    logEvent('answers',1);if(ok){logEvent('correct',1);STATE.xp=(STATE.xp||0)+2;}
    queueSave();
  }
}
function showFeedback(ok,ex,userAns){
  let correctText='';
  if(ex.type==='choice'||ex.type==='listen')correctText=ex.options[ex.answer];
  else if(ex.type==='assemble')correctText=ex.answer;
  else if(ex.type==='input')correctText=ex.accept[0];
  else if(ex.type==='match')correctText='';
  const fb=`<div class="feedback ${ok?'ok':'bad'}">
    <b>${ok?'Верно!':'Неверно.'}</b>
    ${!ok&&userAns?`<div class="muted">Ваш ответ: <span class="jp">${esc(userAns)}</span></div>`:''}
    ${correctText?`<div>Правильный ответ: <span class="jp">${renderFuri(correctText)}</span></div>`:''}
    ${ex.expl?`<p class="why">${esc(ex.expl)}</p>`:''}
   </div>
   ${SESSION.exIdx===currentExList().length-1
     ?`<button class="btn big" id="ex-next">${SESSION.kind==='exam'?'Завершить контрольную':'Завершить урок'}</button>`
     :'<button class="btn big" id="ex-next">Дальше</button>'}`;
  document.getElementById('fb-slot').innerHTML=fb;
  document.getElementById('ex-next').onclick=()=>{
    SESSION.exIdx++;
    if(SESSION.kind==='exam'){
      if(SESSION.exIdx>=SESSION.exList.length)finishExam();else renderExercise(SESSION.exList[SESSION.exIdx]);
    }else renderLessonStep();
  };
  document.getElementById('ex-next').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function finishLesson(){
  const L=SESSION.L;
  const pct=SESSION.answered?Math.round(SESSION.correct/SESSION.answered*100):0;
  const passed=pct>=70;
  const prev=(STATE.lessons[L.id]||{});
  STATE.lessons[L.id]={status:(prev.status==='done'||passed)?'done':'started',score:Math.max(prev.score||0,pct),at:Date.now()};
  let added=0;
  for(const wid of L.words)if(!STATE.cards[wid]){STATE.cards[wid]=newCard(wid);added++;}
  STATE.xp=(STATE.xp||0)+(passed?15:5);
  queueSave();
  SESSION=null;
  $app.innerHTML=shell(`<div class="lesson-step"><div class="card" style="text-align:center">
   <h2>${passed?'Урок пройден!':'Почти получилось'}</h2>
   <p style="font-size:2rem;font-weight:800">${pct}%</p>
   <p>${passed?'Порог перехода — 70%. Урок открыт, слова добавлены в колоду повторений.':'Порог перехода — 70%. Разберите ошибки и пройдите проверку ещё раз — это нормально.'}</p>
   ${added?`<p class="muted">Новых слов в колоде: ${added}</p>`:''}
   <p class="muted">${esc(L.canDo)}</p>
   <button class="btn big" data-go="today">На главный экран</button>
   ${passed?'':'<button class="btn ghost" id="retry" style="width:100%;margin-top:10px">Пройти задания снова</button>'}
  </div></div>`,null);
  $app.querySelector('[data-go="today"]').onclick=()=>go('today');
  const r=document.getElementById('retry');
  if(r)r.onclick=()=>startLesson(L.id);
}

       <button class="btn small ghost" id="lab-resetshift">Сбросить</button>
