      <p class="muted">Реплики идут раньше звука → сдвигайте вперёд (+). Сдвиг действует на весь список и на переходы к медиа.</p></div>
     <div class="card"><div class="switch"><span>Скрыть японский текст (клик по реплике откроет)</span>
      <input type="checkbox" id="lab-hide" ${Lb.hideText?'checked':''}></div></div>
     <div id="cue-list"></div>`;
  }
  $app.innerHTML=shell(html,'lab');
  if(!Lb.cues.length){
    document.getElementById('btn-parse').onclick=()=>{
      const t=document.getElementById('sub-text').value;
      const cues=parseSubtitles(t);
      if(!cues.length){toast('Не удалось найти реплики — проверьте формат SRT/VTT');return;}
      Lb.cues=cues;Lb.ruText=document.getElementById('sub-ru').value||'';
      queueSave();renderLab();toast('Разобрано реплик: '+cues.length);
    };
    document.getElementById('sub-file').onchange=e=>{
      const f=e.target.files[0];if(!f)return;
      const rd=new FileReader();
      rd.onload=()=>{
        const cues=parseSubtitles(rd.result);
        if(!cues.length){toast('Файл не распознан как SRT/VTT');return;}
        Lb.cues=cues;Lb.ruText='';queueSave();renderLab();toast('Разобрано реплик: '+cues.length);
      };
      rd.readAsText(f);
    };
    return;
  }
  document.getElementById('lab-reset').onclick=()=>{
    if(confirm('Заменить текущие субтитры? Разобранные реплики и заметки будут потеряны (карточки из реплик останутся в колоде).')){
      if(LAB.url){URL.revokeObjectURL(LAB.url);LAB={media:null,loopEnd:null,url:null};}
      STATE.labs={cues:[],offset:0,notes:{},hideText:false,ruText:''};queueSave();renderLab();
    }
  };
  $app.querySelectorAll('[data-shift]').forEach(b=>b.addEventListener('click',()=>{
    Lb.cues=shiftCues(Lb.cues,+b.dataset.shift);
    Lb.offset+=+b.dataset.shift;
    document.getElementById('shift-val').textContent=Lb.offset.toFixed(1)+' с';
    queueSave();renderCueList();
  }));
  document.getElementById('lab-resetshift').onclick=()=>{Lb.offset=0;Lb.cues=shiftCues(Lb.cues,-0);queueSave();renderLab();};
  document.getElementById('lab-hide').onchange=e=>{Lb.hideText=e.target.checked;queueSave();renderCueList();};
  document.getElementById('media-file').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    if(LAB.url)URL.revokeObjectURL(LAB.url);
    LAB.url=URL.createObjectURL(f);
    document.getElementById('media-slot').innerHTML=`<video id="lab-media" controls style="width:100%;max-height:320px;border-radius:10px;background:#000" src="${LAB.url}"></video>`;
    const m=document.getElementById('lab-media');
    m.addEventListener('error',()=>{document.getElementById('media-error').style.display='block';});
    m.addEventListener('timeupdate',()=>{
      if(LAB.loopEnd!==null&&m.currentTime>=LAB.loopEnd){LAB.loopEnd=null;m.pause();}
    });
  };
  renderCueList();
}
function renderCueList(){
  const Lb=ensureLabs();
  const media=document.getElementById('lab-media');
  const ruCues=Lb.ruText?parseSubtitles(Lb.ruText):null;
  const show=Lb.cues.slice(0,300);
  let out='<div class="card">';
  show.forEach((c,i)=>{
    const ru=ruCues&&ruCues[i]?`<div class="muted">${esc(ruCues[i].text)}</div>`:'';
    const note=Lb.notes[i]?`<div class="muted">✎ ${esc(Lb.notes[i])}</div>`:'';
    const hidden=Lb.hideText;
    out+=`<div class="course-item" style="padding:8px 10px;margin:6px 0">
     <button class="btn small" data-seek="${i}" ${media?'':'disabled'} title="${media?'Перейти':'Откройте медиафайл выше'}">▶</button>
     <button class="btn small ghost" data-loop="${i}" ${media?'':'disabled'} title="Повторить отрезок">⟲</button>
     <div style="flex:1;min-width:0">
      <span class="muted" style="font-size:.78rem">${formatTimecode(c.start,true)} → ${formatTimecode(c.end,true)}</span>
      <div class="jp ${hidden?'sub-hidden':''}" data-txt="${i}" style="font-size:1.05rem;cursor:${hidden?'pointer':'default'}">${renderFuri(c.text)}</div>
      ${ru}${note}
     </div>
     <button class="btn small ghost" data-note="${i}">✎</button>
     <button class="btn small ghost" data-card="${i}" title="Сделать карточку">📇</button>
     <button class="btn small ghost" data-look="${i}" title="Разбор по словарю">📖</button>
     <div style="flex-basis:100%" id="look-${i}"></div>
    </div>`;
  });
  if(Lb.cues.length>300)out+=`<p class="muted">Показаны первые 300 реплик из ${Lb.cues.length}.</p>`;
  out+='</div>';
  document.getElementById('cue-list').innerHTML=out;
  const list=document.getElementById('cue-list');
  list.querySelectorAll('[data-seek]').forEach(b=>b.addEventListener('click',()=>{
    const m=document.getElementById('lab-media');if(!m)return;
    const c=Lb.cues[+b.dataset.seek];
    m.currentTime=Math.max(0,c.start+Lb.offset);m.play();
  }));
  list.querySelectorAll('[data-loop]').forEach(b=>b.addEventListener('click',()=>{
    const m=document.getElementById('lab-media');if(!m)return;
    const c=Lb.cues[+b.dataset.loop];
    m.currentTime=Math.max(0,c.start+Lb.offset);
    LAB.loopEnd=c.end+Lb.offset;
    m.play();
  }));
  list.querySelectorAll('[data-txt]').forEach(el=>el.addEventListener('click',()=>el.classList.remove('sub-hidden')));
  list.querySelectorAll('[data-note]').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.note;
    const t=prompt('Заметка к реплике (останется локально):',Lb.notes[i]||'');
    if(t===null)return;
    if(t==='')delete Lb.notes[i];else Lb.notes[i]=t;
    queueSave();renderCueList();
  }));
  list.querySelectorAll('[data-look]').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.look;
    Lb.open[i]=!Lb.open[i];
    const slot=document.getElementById('look-'+i);
    if(!Lb.open[i]){slot.innerHTML='';return;}
    const c=Lb.cues[i];
    const idx=buildLabIndex(WORDS,Lb.userDict||{});
    const toks=tokenizeLabText(c.text,idx);
    const chips=toks.map(x=>{
      if(x.hit)return `<span class="token in-answer" title="${esc(x.hit.ru||'')} (${esc(x.hit.pos||'')})" style="cursor:default">${esc(x.t)}</span>`;
      return `<span class="token token-miss" data-add="${esc(x.t)}" title="Нет в словаре — нажмите, чтобы добавить значение">${esc(x.t)}</span>`;
    }).join(' ');
    slot.innerHTML=`<div style="flex-basis:100%;margin-top:8px">
      <div class="audio-note" style="margin:0 0 8px">Совпадения с встроенным словарём (${Object.keys(WORDS).length} слов) — это <b>не грамматический разбор</b>: формы глаголов (飲みます、食べた、起きて) распознаются только в словарной форме. Серые фрагменты не найдены — нажмите, чтобы добавить значение вручную.</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${chips}</div></div>`;
    slot.querySelectorAll('[data-add]').forEach(el=>el.addEventListener('click',()=>{
      const form=el.dataset.add;
      const ru=prompt('Значение для «'+form+'» (сохранится в разборе лаборатории):','')||'';
      if(!ru)return;
      Lb.userDict=Lb.userDict||{};
      Lb.userDict[form]={ru};
      queueSave();
      b.click();b.click(); // перерисовать панель разбора
    }));
  }));
  list.querySelectorAll('[data-card]').forEach(b=>b.addEventListener('click',()=>{
    const c=Lb.cues[+b.dataset.card];
    const id=hashText(c.text);
    if(!STATE.cards[id]){
      STATE.cards[id]=newCard(id);
      STATE.cards[id].jp=c.text;
      const ru=prompt('Русское значение реплики (можно заполнить позже, оставив пустым):','')||'';
      STATE.cards[id].ru=ru;
      queueSave();toast('Карточка создана — она появится в повторениях');
    }else toast('Карточка из этой реплики уже есть');
  }));
}

/* ---------- Контрольные работы (экзамены) ---------- */
function examUnlocked(E){return E.lessons.every(id=>(STATE.lessons[id]||{}).status==='done');}
function startExam(examId){
  const E=EXAMS.find(e=>e.id===examId);
  if(!E)return;
  const pool=[];
  for(const lid of E.lessons){const L=LESSONS.find(l=>l.id===lid);if(L)pool.push(...L.exercises);}
  const exList=shuffle(pool).slice(0,12);
  SESSION={kind:'exam',E,exList,exIdx:0,correct:0,answered:0};
  renderExercise(exList[0]);
}
function finishExam(){
  const E=SESSION.E;
  const pct=SESSION.answered?Math.round(SESSION.correct/SESSION.answered*100):0;
  const passed=pct>=75;
  const prev=STATE.exams[E.id]||{};
  STATE.exams[E.id]={status:passed?'done':'attempted',score:Math.max(prev.score||0,pct),at:Date.now(),attempts:(prev.attempts||0)+1};
  if(passed)STATE.xp=(STATE.xp||0)+30;
  queueSave();
  SESSION=null;
  $app.innerHTML=shell(`<div class="lesson-step"><div class="card" style="text-align:center">
   <h2>${passed?'Контрольная сдана!':'Пока не сдано'}</h2>
   <p style="font-size:2rem;font-weight:800">${pct}%</p>
   <p>${passed?'Порог 75% пройден. Модуль закреплён.':'Порог — 75%. Разберите ошибки (они видны в статистике) и пересдайте — попытки не ограничены.'}</p>
   <button class="btn big" data-go="course">К карте курса</button>
   ${passed?'':'<button class="btn ghost" id="retake" style="width:100%;margin-top:10px">Пересдать сразу</button>'}
  </div></div>`,null);
  $app.querySelector('[data-go="course"]').onclick=()=>go('course');
  const r=document.getElementById('retake');
  if(r)r.onclick=()=>startExam(E.id);
}

/* ---------- Повторения (SRS) ---------- */
function kanjiDeck(){return buildKanjiDeck(WORDS,STATE.cards);}
function dueKanji(){
  const now=Date.now(),deck=kanjiDeck();
  return Object.keys(deck).map(id=>{
    const c=STATE.kanjiCards[id]||newCard(id);
    return {id,card:c,deck:deck[id]};
  }).filter(x=>(x.card.due||0)<=now).sort((a,b)=>a.card.due-b.card.due);
}
function renderReviewHome(){
  const due=dueCards().length,newN=Math.min(newCandidates().length,STATE.settings.newLimit);
  const dueK=dueKanji().length,kanjiTotal=Object.keys(kanjiDeck()).length;
  const html=`<div class="card"><h2>Повторения</h2>
   <p class="muted">Планировщик: адаптированный SM-2 (${SCHED_VERSION}). Интервалы растут при успешных повторениях, ошибка возвращает карточку без штрафа.</p>
   <p>Слова — к повторению: <b>${due}</b> · Новых: <b>${newN}</b> (лимит ${STATE.settings.newLimit}/день)</p>
   <p>Кандзи — к повторению: <b>${dueK}</b> из ${kanjiTotal} знаков, найденных в словах уроков</p>
   ${due+newN>0?`<button class="btn big" id="go-review">Повторять слова</button>`:'<p class="muted">Слова: пока ничего не подошло по срокам.</p>'}
   ${dueK>0?`<button class="btn big ghost" id="go-review-k" style="margin-top:8px">Повторять кандзи (${dueK})</button>`:`<p class="muted">Кандзи: подходят по срокам позже. Карточка кандзи — знак и слова с ним; чтение именно в этих словах.</p>`}
   <p class="muted">Оценки: «не помню» возвращает карточку в тот же сеанс, «легко» сильно увеличивает интервал.</p></div>`;
  $app.innerHTML=shell(html,'review');
  const b=document.getElementById('go-review');
  if(b)b.onclick=()=>startReview('words');
  const bk=document.getElementById('go-review-k');
  if(bk)bk.onclick=()=>startReview('kanji');

function startReview(){
  const queue=dueCards().map(c=>({card:c,isNew:false}));
  const newIds=newCandidates().slice(0,STATE.settings.newLimit);
  for(const id of newIds)queue.push({card:STATE.cards[id]||newCard(id),isNew:true,id});
  if(!queue.length){toast('Нечего повторять');go('review');return;}
  SESSION={kind:'review',queue,i:0,requeue:0,reviewsDone:0};
  renderReviewCard();
}
function renderReviewCard(){
  if(SESSION.i>=SESSION.queue.length){finishReview();return;}
  const item=SESSION.queue[SESSION.i];
  const c=item.card;
  const isKana=c.id.startsWith('k_');
  const isKanji=SESSION.mode==='kanji'||c.id.startsWith('kz_');
  const w=isKana?null:(isKanji?null:WORDS[c.id]);
  const kdEntry=isKanji?kanjiDeck()[c.id]:null;
  const dir=SESSION.mode==='words'?dirFromId(c.id):null;
  const we=(!isKanji&&!isKana)?wordEntryFor(WORDS,c.id):null;
  const jpText=isKanji?(kdEntry?kdEntry.kanji:c.id.slice(3)):(isKana?c.id.slice(2):(w?w.jp:(we?we.jp:(c.jp||'?'))));
  const kana=isKanji?'':(isKana?(c.ru||''):(we?we.kana:(w?w.kana:(c.kana||''))));
  const ru=isKanji?'':(isKana?(c.ru||''):(we?we.ru:(w?w.ru:(c.ru||''))));
  const pos=isKana?'':(w?`<span class="badge">${esc(w.pos)}</span>`:'');
  SESSION._revealed=false;
  const example=(!isKana&&w&&w.jp&&c.ivl>=2)?'':'';
  const askJp=dir!=='read';           // в чтении спрашиваем значение
  const askRu=dir==='read'||!dir;
  const front=dir==='rec'?jpText:dir==='read'?(ru||jpText):jpText;
  $app.innerHTML=shell(`<div class="lesson-step">
   <div class="spread"><span class="badge">Карточка ${SESSION.i+1} из ${SESSION.queue.length}${dir?' · '+({rec:'узнавание',read:'чтение',listen:'на слух'})[dir]:''}</span>
    <button class="btn small ghost" id="quit-review">Закончить</button></div>
   <div class="card srs-card">
    ${dir==='listen'?'':'<span class="q-jp">'+renderFuri(front)+(dir==='read'&&ru?('<div class=\'muted\' style=\'font-size:.95rem\'>(японское: '+esc(jpText)+')</div>'):'')+'</span>'}
    ${dir==='listen'?'<div class="audio-note" id="listen-note">Прослушайте (голос) и выберите значение.</div><div class="row" style="justify-content:center;margin:14px 0"><button class="play-btn" id="play-btn">▶</button></div>':''}
    ${kana?`<div class="muted jp" id="srs-kana" style="display:none">${esc(kana)}</div>`:''}
    <div id="srs-back" style="display:none">
      ${isKanji?`<p class="muted">Встречается в ${kdEntry.count} слов(е/ах) уроков:</p>${(kdEntry.words||[]).map(x=>`<p style="margin:6px 0"><span class="jp" style="font-size:1.15rem">${renderFuri(x.jp)} (${esc(x.kana)})</span> — ${esc(x.ru)}</p>`).join('')}`
        :isKana?`<p style="font-size:1.3rem" class="jp">${esc(ru)}</p>`
        :`<p style="font-size:1.25rem"><b>${esc(ru)}</b></p>${pos}<p class="muted jp">чтение: ${esc(kana)}</p>${dir==='listen'?`<p class="muted jp">слово: ${esc(jpText)}</p>`:''}`}
    </div>
    <button class="btn big" id="reveal">${dir==='listen'?'Показать ответ':isKanji?'Показать слова':isKana?'Показать чтение':'Показать ответ'}</button>
    <div class="grade-row" id="grades" style="display:none">
      <button class="g0" data-g="0">Не помню</button>
      <button class="g1" data-g="1">Трудно</button>
      <button class="g2" data-g="2">Помню</button>
      <button class="g3" data-g="3">Легко</button>
    </div>
   </div></div>`,null);
  document.getElementById('quit-review').onclick=finishReview;
  if(dir==='listen'){
    document.getElementById('play-btn').onclick=()=>{
      if(speak(jpText)){const n=document.getElementById('listen-note');if(n)n.textContent='Прослушайте и ответьте. Можно прослушать снова.';}
      else toast('Не удалось воспроизвести звук');
    };
  }
  const sb=document.getElementById('suspend-btn');
  if(sb)sb.onclick=()=>{
    const id=item.id||c.id;
    if(confirm('Приостановить карточку? Она перестанет появляться в повторениях, пока не вернёте её в Настройках.')){
      STATE.cards[id].suspended=true;queueSave();toast('Карточка приостановлена');
      SESSION.i++;SESSION.reviewsDone++;renderReviewCard();
    }
  };
  document.getElementById('reveal').onclick=()=>{
    SESSION._revealed=true;
    document.getElementById('reveal').style.display='none';
    const back=document.getElementById('srs-back');if(back)back.style.display='block';
    const kn=document.getElementById('srs-kana');if(kn)kn.style.display='block';
    document.getElementById('grades').style.display='grid';
  };
  $app.querySelectorAll('.grade-row button').forEach(b=>b.addEventListener('click',()=>answerReview(+b.dataset.g)));
}
function answerReview(g){
  const item=SESSION.queue[SESSION.i];
  const updated=schedule(item.card,g);
  if(SESSION.mode==='kanji'){STATE.kanjiCards=STATE.kanjiCards||{};STATE.kanjiCards[item.id]=updated;}
  else STATE.cards[item.id||item.card.id]=updated;
  logEvent('reviews',1);
  if(g>=2)STATE.xp=(STATE.xp||0)+1;
  if(g===0){SESSION.queue.push({card:updated,isNew:false,id:item.id||item.card.id});SESSION.requeue++;}
  SESSION.reviewsDone++;SESSION.i++;
  queueSave();
  renderReviewCard();
}
function finishReview(){
  const done=SESSION?SESSION.reviewsDone:0;
  SESSION=null;
  $app.innerHTML=shell(`<div class="card" style="text-align:center">
   <h2>Сеанс повторений завершён</h2><p>Повторено карточек: <b>${done}</b></p>
   <p class="muted">Карточки, отмеченные «не помню», вернутся через 10 минут.</p>
   <button class="btn big" data-go="today">На главный экран</button></div>`,'review');
  $app.querySelector('[data-go="today"]').onclick=()=>go('today');
}

     <tr><td style="text-align:left">Кандзи</td><td>${bd.kanji.new}</td><td>${bd.kanji.learn}</td><td>${bd.kanji.young}</td><td>${bd.kanji.mature}</td><td>${bd.kanji.susp||'—'}</td></tr>
    </table>
    <p class="muted">Направления независимы: успех в узнавании не означает освоение чтения или аудирования (ТЗ §7). Этапы по интервалу планировщика: новые — ещё не повторялись; кратко — 1–6 дней; средне — 7–20; закреплено — 21 и больше. Приостановленные считаются отдельно и по расписанию не приходят.</p></div>
   <div class="card"><h3>Кандзи</h3>
    <p>Знаков в колоде (из слов уроков): <b>${Object.keys(kanjiDeck()).length}</b> · Закреплено: <b>${Object.values(STATE.kanjiCards||{}).filter(c=>c.ivl>=21).length}</b></p>
    <p class="muted">Кандзи изучаются внутри слов: карточка показывает знак и слова с ним, а не список «всех чтений».</p></div>
   <div class="card"><h3>Последние ошибки в уроках</h3>
    ${recentMistakes.length?recentMistakes.map(m=>{
      let q='';for(const L of LESSONS){const ex=L.exercises.find(x=>x.id===m.exId);if(ex){q=ex.q;break;}}
      return `<p class="muted">• ${esc(q||m.exId)}</p>`;}).join(''):'<p class="muted">Пока пусто.</p>'}
   </div>
   <div class="card"><h3>Отдельные показатели</h3>
    <p class="muted">Чтение и аудирование пока считаются вместе; раздельные показатели появятся вместе с аниме-лабораторией (этап 3 ТЗ).</p></div>`;
  $app.innerHTML=shell(html,'stats');
}

/* ---------- Настройки ---------- */
function renderSettings(){
  const s=STATE.settings;
  const html=`<div class="card">
   <div class="field"><label>Тема</label>
    <select id="set-theme"><option value="light" ${s.theme==='light'?'selected':''}>Светлая</option><option value="dark" ${s.theme==='dark'?'selected':''}>Тёмная</option></select></div>
   <div class="field"><label>Акцентный цвет</label>
    <select id="set-accent">
     <option value="indigo" ${(s.accent||'indigo')==='indigo'?'selected':''}>Индиго (как сейчас)</option>
     <option value="sakura" ${s.accent==='sakura'?'selected':''}>Сакура — розовый</option>
     <option value="matcha" ${s.accent==='matcha'?'selected':''}>Матча — зелёный</option>
     <option value="sumi" ${s.accent==='sumi'?'selected':''}>Суми — графитовый</option>
     <option value="ai" ${s.accent==='ai'?'selected':''}>Аи — фиолетовый</option>
    </select></div>
   <div class="field"><label>Фуригана</label>
    <select id="set-furi">
     <option value="always" ${s.furigana==='always'?'selected':''}>Всегда показывать</option>
     <option value="tap" ${s.furigana==='tap'?'selected':''}>По нажатию</option>
     <option value="hidden" ${s.furigana==='hidden'?'selected':''}>Скрыть</option></select></div>
   <div class="field"><label>Новых карточек в день: <b id="nl-val">${s.newLimit}</b></label>
    <input type="range" id="set-newlimit" min="3" max="20" step="1" value="${s.newLimit}"></div>
   <div class="field"><label>Скорость озвучки: <b id="rate-val">${s.rate}</b></label>
    <input type="range" id="set-rate" min="0.5" max="1.1" step="0.05" value="${s.rate}"></div>
  </div>
  <div class="card"><h3>Озвучка (системный TTS)</h3>
   <div class="audio-note" id="voice-warning" style="display:${hasJaVoice()?'none':'block'}">Японский голос не найден. Установите японский голос синтеза речи в системе (Android: Настройки → Язык и ввод → Синтез речи; Windows: Параметры → Время и язык → Речь) и перезагрузите страницу. Без голоса аудирование не засчитывается, но весь текст остаётся доступным.</div>
   <div class="field"><label>Голос</label><select id="voice-select"></select></div>
   <button class="btn small ghost" id="test-voice">Проверить голос</button>
  </div>
  <div class="card"><h3>Резервная копия прогресса</h3>
   <p class="muted">Прогресс хранится локально в этом браузере и привязан к адресу страницы. Экспортируйте файл, чтобы перенести прогресс на другое устройство (это ручной перенос, а не автоматическая синхронизация). Импорт объединяет данные без удаления истории: по каждой карточке берётся более новая запись.</p>
   <div class="row"><button class="btn" id="btn-export">Экспорт в JSON</button>
   <label class="btn ghost" style="display:inline-block">Импорт из JSON<input type="file" id="btn-import" accept=".json,application/json" style="display:none"></label></div>
  </div>
  <div class="card"><h3>Импорт из Anki (текстовый экспорт)</h3>
   <p class="muted">В Anki: выберите колоду → Файл → Экспорт → формат «Простой текст, поля через табуляцию». Файл .apkg не поддерживается. Существующие значения не перезаписываются: дубликаты показываются и пропускаются с вашего подтверждения.</p>
   <label class="btn ghost" style="display:inline-block">Выбрать файл экспорта (.txt)<input type="file" id="anki-file" accept=".txt,.csv,text/plain,text/tab-separated-values" style="display:none"></label>
   <div id="anki-preview"></div>
  </div>
  <div class="card"><h3>Приостановленные карточки</h3>
   ${( ()=>{const sus=Object.keys(STATE.cards).filter(id=>STATE.cards[id].suspended);
     return sus.length?sus.map(id=>`<p class="muted">• ${esc(id)} <button class="btn small ghost" data-uns="${esc(id)}">вернуть</button></p>`).join(''):'<p class="muted">Нет.</p>';})()}
  </div>
  <div class="card"><h3>Экспорт слов (CSV/JSON)</h3>
   <p class="muted">Выгрузка изученных слов с интервалами планировщика (ТЗ §7). CSV открывается в Excel/Anki (разделитель — запятая).</p>
   <div class="row"><button class="btn small" id="exp-csv">CSV</button><button class="btn small" id="exp-json">JSON</button></div>
  </div>
  <div class="card"><h3>Сообщения об ошибках в заданиях</h3>
   ${STATE.reports.length?STATE.reports.map(r=>`<p class="muted">• [${new Date(r.at).toLocaleString('ru-RU')}] ${esc(r.exId)}: ${esc(r.text)}</p>`).join(''):'<p class="muted">Пока нет.</p>'}
  </div>
  <div class="card"><h3>О данных</h3>
   <p class="muted">Схема данных: v${STATE_VERSION} · планировщик: ${SCHED_VERSION} · контент: v${CONTENT_VERSION}. Облачной синхронизации нет — приложение работает полностью локально.</p>
   <button class="btn danger small" id="btn-reset">Сбросить весь прогресс</button></div>`;
  $app.innerHTML=shell(html,'settings');
  initVoices();
  document.getElementById('set-theme').onchange=e=>{STATE.settings.theme=e.target.value;queueSave();applySettings();};
  document.getElementById('set-accent').onchange=e=>{STATE.settings.accent=e.target.value;queueSave();applySettings();};
  document.getElementById('set-furi').onchange=e=>{STATE.settings.furigana=e.target.value;queueSave();applySettings();};
  document.getElementById('set-newlimit').oninput=e=>{STATE.settings.newLimit=+e.target.value;document.getElementById('nl-val').textContent=e.target.value;queueSave();};
  document.getElementById('set-rate').oninput=e=>{STATE.settings.rate=+e.target.value;document.getElementById('rate-val').textContent=e.target.value;queueSave();};
  document.getElementById('voice-select').onchange=e=>{STATE.settings.voiceURI=e.target.value;queueSave();};
  document.getElementById('test-voice').onclick=()=>{speak('こんにちは。日本語を勉強しましょう。')?null:toast('Голос недоступен');};
  document.getElementById('btn-export').onclick=exportProgress;
  document.getElementById('btn-import').onchange=importProgress;
  document.getElementById('anki-file').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      const ank=parseAnkiExport(rd.result);
      const pv=document.getElementById('anki-preview');
      if(!ank.rows.length){pv.innerHTML='<div class="audio-note">Не удалось найти строки с данными. Убедитесь, что экспорт был в «Простой текст».</div>';return;}
      const n=Math.max(...ank.rows.map(r=>r.length));
      const colOpts=sel=>['<option value="-1">— не использовать —</option>'].concat(Array.from({length:n},(_,i)=>`<option value="${i}" ${i===sel?'selected':''}>колонка ${i+1}${ank.rows[0][i]?': '+esc(ank.rows[0][i].slice(0,20)):''}</option>`)).join('');
      const def=j=>j<n?j:Math.min(j,n-1);
      pv.innerHTML=`<p class="muted">Найдено строк: <b>${ank.rows.length}</b>, разделитель: ${ank.delimiter==='\t'?'табуляция':';'}.</p>
       <div class="field"><label>Колонка «Японское слово»</label><select id="ak-jp">${colOpts(def(0))}</select></div>
       <div class="field"><label>Колонка «Чтение (кана)»</label><select id="ak-kana">${colOpts(def(1))}</select></div>
       <div class="field"><label>Колонка «Значение (рус.)»</label><select id="ak-ru">${colOpts(def(2))}</select></div>
       <div class="row"><button class="btn" id="ak-scan">Проверить дубликаты</button></div><div id="ak-result"></div>`;
      document.getElementById('ak-scan').onclick=()=>{
        const mapping={jp:+document.getElementById('ak-jp').value,kana:+document.getElementById('ak-kana').value,ru:+document.getElementById('ak-ru').value};
        if(mapping.jp<0){toast('Выберите колонку японского слова');return;}
        const dups=findDuplicates(ank.rows,mapping,STATE.cards,WORDS);
        const fresh=ank.rows.length-dups.length;
        const res=document.getElementById('ak-result');
        res.innerHTML=`<p>Новых: <b>${fresh}</b> · Дубликатов: <b>${dups.length}</b>${dups.length?` <span class="muted">(например: ${esc(dups.slice(0,3).map(d=>d.jp).join(', '))}…)</span>`:''}</p>
         <p class="muted">Дубликаты будут пропущены: существующие значения не перезаписываются.</p>
         <button class="btn" id="ak-do">Импортировать ${fresh} новых</button>`;
        document.getElementById('ak-do').onclick=()=>{
          const dupRows=new Set(dups.map(d=>d.row));
          let added=0;
          ank.rows.forEach((r,i)=>{
            if(dupRows.has(i))return;
            const jp=r[mapping.jp];if(!jp)return;
            const id=idForLab(jp);
            if(!STATE.cards[id]){
              STATE.cards[id]=newCard(id);
              STATE.cards[id].jp=jp;
              if(mapping.kana>=0)STATE.cards[id].kana=r[mapping.kana]||'';
              if(mapping.ru>=0)STATE.cards[id].ru=r[mapping.ru]||'';
              added++;
            }
          });
          queueSave();toast('Импортировано карточек: '+added);
          renderSettings();
        };
      };
    };
    rd.readAsText(f);
  };
  $app.querySelectorAll('[data-uns]').forEach(b=>b.addEventListener('click',()=>{
    STATE.cards[b.dataset.uns].suspended=false;queueSave();renderSettings();toast('Карточка возвращена');
  }));
  const dl=(data,mime,name)=>{const b=new Blob([data],{type:mime});const x=document.createElement('a');x.href=URL.createObjectURL(b);x.download=name;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(x.href),5000);};
  document.getElementById('exp-csv').onclick=()=>{dl('\ufeff'+exportWordsCSV(STATE,WORDS),'text/csv','jp-words-'+dayKey()+'.csv');};
  document.getElementById('exp-json').onclick=()=>{dl(JSON.stringify(exportWordsCSV(STATE,WORDS).split('\n').slice(1).map(l=>l.split(','))),'application/json','jp-words-'+dayKey()+'.json');};
  document.getElementById('btn-reset').onclick=()=>{
    if(confirm('Удалить весь локальный прогресс? Это необратимо. Сначала можно сделать экспорт.')){
      STATE=defaultState();queueSave();render();toast('Прогресс сброшен');
    }
  };
}
function exportProgress(){
  const data=JSON.stringify({app:'jp-anime-path',version:STATE_VERSION,exported_at:new Date().toISOString(),state:STATE},null,1);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='jp-progress-'+dayKey()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('Файл экспорта скачан');
}
function importProgress(e){
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const data=JSON.parse(rd.result);
      if(!data||data.app!=='jp-anime-path'||!data.state)throw new Error('bad format');
      if(!confirm('Импортировать резервную копию от '+(data.exported_at||'?')+'?\nДанные будут объединены: более новые записи карточек заменят старые, история не удаляется.'))return;
      STATE=mergeState(STATE,data.state);
      queueSave();render();toast('Импорт выполнен');
    }catch(err){alert('Не удалось прочитать файл: '+(err&&err.message?err.message:'неверный формат'));}
  };
  rd.readAsText(f);
}
